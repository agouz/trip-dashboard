<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Gotham Itinerary" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#16222C" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="manifest" href="manifest.json" />
<title>Gotham Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#16222C; --ink-2:#1E2E3A; --ink-3:#243747;
    --parchment:#EDE3CF; --parchment-dim:#B9B2A0;
    --amber:#E3A33B; --moss:#6B8E63; --rust:#C1573D; --slate:#4D7A95;
    --hairline:rgba(237,227,207,0.14); --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{background-color:#16222C; background-color:var(--ink);}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--parchment); font-family:'Space Grotesk',sans-serif; min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace; letter-spacing:0.02em;}
  #app{max-width:520px; margin:0 auto; padding:18px 14px 60px; min-height:100vh; background:var(--ink);}

  header.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--hairline);}
  header.top .tag{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--amber); border:1px solid var(--amber); padding:3px 7px; border-radius:20px; white-space:nowrap;}
  .hamburger-btn{width:40px; height:40px; border-radius:9px; background:var(--ink-2); border:1px solid var(--hairline); color:var(--parchment); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;}

  .side-nav-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:190; opacity:0; pointer-events:none; transition:opacity 0.22s ease;}
  .side-nav-overlay.open{opacity:1; pointer-events:auto;}
  .side-nav{position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px; background:var(--ink-2); border-right:1px solid var(--hairline); z-index:200; transform:translateX(-105%); transition:transform 0.25s ease; padding:18px 14px; display:flex; flex-direction:column; box-shadow:8px 0 28px rgba(0,0,0,0.4);}
  .side-nav.open{transform:translateX(0);}
  .side-nav-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--hairline);}
  .side-nav-brand{font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .side-nav-close{background:none; border:none; color:var(--parchment-dim); font-size:22px; cursor:pointer; line-height:1;}
  .side-nav-item{display:flex; align-items:center; gap:12px; padding:13px 12px; border-radius:10px; color:var(--parchment-dim); font-weight:600; font-size:15px; cursor:pointer; margin-bottom:3px;}
  .side-nav-item .sn-ic{font-size:17px; width:22px; text-align:center;}
  .side-nav-item.active{background:rgba(227,163,59,0.14); color:var(--amber);}
  .side-nav-item.logout{color:var(--rust);}
  .side-nav-spacer{flex:1;}


  .banner{background:var(--ink-2); border:1px solid var(--hairline); border-left:3px solid var(--rust); border-radius:var(--radius); padding:13px 14px; margin-bottom:18px; cursor:pointer;}
  .banner .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--rust); margin-bottom:5px;}
  .banner .title{font-size:17px; font-weight:600; margin-bottom:3px; color:var(--parchment);}
  .banner .meta{font-size:13px; color:var(--parchment-dim);}

  #countries{display:flex; flex-direction:column; gap:10px;}
  .country{position:relative; border:1px solid var(--hairline); border-radius:var(--radius); background:var(--ink-2); overflow:hidden;}
  .country::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--accent, var(--hairline));}
  .country-head{display:flex; align-items:center; gap:12px; padding:14px 14px 14px 18px; cursor:pointer;}
  .country-flag{font-size:20.5px; line-height:1; width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--accent-soft, var(--ink-3)); border:1px solid var(--accent, var(--hairline)); flex-shrink:0;}
  .country-main{flex:1; min-width:0;}
  .country-name{font-size:18px; font-weight:700;}
  .country-dates{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--parchment-dim); margin-top:2px;}
  .country-status{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .status-bar{display:flex; gap:2px;}
  .status-bar i{width:5px; height:14px; border-radius:2px; display:block;}
  .chev{font-size:15px; color:var(--parchment-dim); transition:transform 0.2s ease;}
  .country.open .chev{transform:rotate(90deg);}
  .country-body{display:none; padding:0 12px 14px 18px; border-top:1px solid var(--hairline);}
  .country.open .country-body{display:block;}

  .rail-wrap{margin-bottom:16px;}
  .rail{display:flex; height:9px; border-radius:6px; overflow:hidden; gap:2px; position:relative;}
  .rail-seg{height:100%; border-radius:2px; cursor:pointer; opacity:0.85; transition:opacity 0.15s ease;}
  .rail-seg:active{opacity:1;}
  .rail-marker{position:absolute; top:-4px; width:2px; height:17px; background:var(--parchment); border-radius:1px; pointer-events:none;}
  .rail-caption{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--parchment-dim); margin-top:6px; text-align:center;}
  .rail-caption b{color:var(--parchment);}

  .leg{position:relative; margin-top:10px; cursor:pointer;}
  .leg-card{background:var(--ink-3); border:1px solid var(--hairline); border-radius:10px; padding:11px 13px; position:relative; overflow:hidden;}
  .leg-card::after{content:''; position:absolute; right:0; top:0; bottom:0; width:4px; background:var(--barcolor, var(--parchment-dim));}
  .leg-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .leg-loc{font-size:15.5px; font-weight:600;}
  .leg-dates{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--parchment-dim); margin-top:2px;}
  .pill{font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:3px 7px; border-radius:20px; white-space:nowrap; text-transform:uppercase; letter-spacing:0.05em;}
  .pill.booked{background:rgba(107,142,99,0.18); color:var(--moss); border:1px solid rgba(107,142,99,0.4);}
  .pill.partial{background:rgba(77,122,149,0.18); color:var(--slate); border:1px solid rgba(77,122,149,0.4);}
  .pill.open{background:rgba(193,87,61,0.18); color:var(--rust); border:1px solid rgba(193,87,61,0.4);}
  .prio{font-size:10.5px; font-family:'IBM Plex Mono',monospace; margin-top:5px; opacity:0.75;}

  .booking-badge{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--amber); margin-top:5px; opacity:0.85;}


  .sheet-tabs{display:flex; gap:6px; margin-bottom:14px;}
  .sheet-tab{flex:1; background:var(--ink-3); border:1px solid var(--hairline); color:var(--parchment-dim); font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; padding:8px 0; border-radius:8px; cursor:pointer; text-align:center;}
  .sheet-tab.active{background:rgba(227,163,59,0.14); border-color:var(--amber); color:var(--amber);}
  .bk-item{background:var(--ink-3); border:1px solid var(--hairline); border-radius:10px; padding:11px 12px; margin-bottom:9px;}
  .bk-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .bk-title{font-size:15px; font-weight:600; display:flex; gap:7px; align-items:flex-start;}
  .bk-cost{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--amber); white-space:nowrap;}
  .bk-provider{font-size:12.5px; color:var(--parchment-dim); margin-top:3px;}
  .bk-note{font-size:12.5px; color:var(--parchment-dim); margin-top:5px; line-height:1.4;}
  .bk-status{display:inline-block; margin-top:6px;}
  .pill.paid{background:rgba(107,142,99,0.18); color:var(--moss); border:1px solid rgba(107,142,99,0.4);}
  .pill.confirmed{background:rgba(77,122,149,0.18); color:var(--slate); border:1px solid rgba(77,122,149,0.4);}
  .pill.reserved{background:rgba(227,163,59,0.18); color:var(--amber); border:1px solid rgba(227,163,59,0.4);}
  .bk-empty{font-size:14px; color:var(--parchment-dim); text-align:center; padding:18px 0;}
  .fd-hero{display:flex; align-items:center; justify-content:space-between; background:var(--ink); border:1px solid var(--hairline); border-radius:10px; padding:12px 10px; margin-bottom:10px;}
  .fd-hero-side{flex:1; text-align:center;}
  .fd-hero-time{font-family:'IBM Plex Mono',monospace; font-size:25.5px; font-weight:700; color:var(--parchment); line-height:1.1;}
  .fd-hero-port{font-size:11.5px; color:var(--parchment-dim); margin-top:4px; line-height:1.3;}
  .fd-hero-mid{flex:0 0 auto; padding:0 8px; text-align:center;}
  .fd-hero-arrow{color:var(--amber); font-size:16px;}
  .fd-hero-dur{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--parchment-dim); margin-top:2px; white-space:nowrap;}

  #overlay{position:fixed; inset:0; background:rgba(10,15,19,0.6); display:none; align-items:flex-end; z-index:50;}
  #sheet{background:var(--ink-2); width:100%; max-width:520px; margin:0 auto; border-radius:18px 18px 0 0; padding:20px 18px 28px; border-top:1px solid var(--hairline); max-height:82vh; overflow-y:auto; position:relative;}
  #sheet .handle{width:36px; height:4px; background:var(--hairline); border-radius:4px; margin:0 auto 14px;}
  #sheet h2{font-size:20.5px; margin:0 0 2px;}
  #sheet .dates{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--parchment-dim); margin-bottom:12px;}
  #sheet .row{margin-bottom:12px;}
  #sheet .row .label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber); margin-bottom:4px;}
  #sheet .row .val{font-size:15px; line-height:1.5; color:var(--parchment);}
  #sheet .close{position:absolute; top:14px; right:16px; background:none; border:none; color:var(--parchment-dim); font-size:20.5px; cursor:pointer;}

  .empty-note{font-size:12.5px; color:var(--parchment-dim); text-align:center; margin-top:24px; line-height:1.6;}

  /* COUNTDOWN */
  .countdown{display:flex; gap:8px; margin-bottom:16px;}
  .cd-box{flex:1; background:var(--ink-2); border:1px solid var(--hairline); border-radius:10px; padding:9px 4px; text-align:center;}
  .cd-num{font-family:'IBM Plex Mono',monospace; font-size:20.5px; font-weight:600; color:var(--amber);}
  .cd-label{font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--parchment-dim); margin-top:2px;}

  /* MAIN TABS */
  .cal-legend{display:flex; flex-wrap:wrap; gap:9px 14px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--hairline);}
  .cal-legend-item{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--parchment-dim);}
  .cal-legend-item i{width:8px; height:8px; border-radius:50%; display:block; flex-shrink:0;}
  .cal-month{margin-bottom:22px;}
  .cal-month-title{font-family:'IBM Plex Mono',monospace; font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber); margin-bottom:9px;}
  .cal-dow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px;}
  .cal-dow div{text-align:center; font-size:9.5px; color:var(--parchment-dim); font-family:'IBM Plex Mono',monospace;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-day{aspect-ratio:1; border-radius:7px; border:1px solid var(--hairline); display:flex; align-items:center; justify-content:center; position:relative; font-size:11.5px; color:var(--parchment-dim); background:var(--ink-3);}
  .cal-day.has-leg{color:var(--parchment); cursor:pointer; font-weight:700; border-color:transparent;}
  .cal-day.has-leg:active{filter:brightness(1.25);}
  .cal-day.empty{background:transparent; border:none;}
  .cal-day.today{box-shadow:0 0 0 2px var(--parchment) inset;}
  .cal-plane{position:absolute; bottom:1px; right:2px; font-size:7.5px;}

  /* COSTS TAB */
  .cost-hero{background:var(--ink-2); border:1px solid var(--hairline); border-left:3px solid var(--amber); border-radius:var(--radius); padding:16px; margin-bottom:14px; text-align:center;}
  .cost-hero .amt{font-family:'IBM Plex Mono',monospace; font-size:32px; font-weight:600; color:var(--amber);}
  .cost-hero .lbl{font-size:12px; color:var(--parchment-dim); text-transform:uppercase; letter-spacing:0.1em; margin-top:4px;}
  .cost-split{display:flex; gap:8px; margin-bottom:18px;}
  .cs-box{flex:1; background:var(--ink-2); border:1px solid var(--hairline); border-radius:10px; padding:10px 6px; text-align:center;}
  .cs-amt{font-family:'IBM Plex Mono',monospace; font-size:16px; font-weight:600;}
  .cs-lbl{font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--parchment-dim); margin-top:3px;}
  .section-title{font-size:12.5px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber); margin:18px 0 10px; font-family:'IBM Plex Mono',monospace;}
  .bar-row{margin-bottom:4px; cursor:pointer; padding:8px 8px; border-radius:8px;}
  .bar-row:active{background:rgba(227,163,59,0.10);}
  .bar-top{display:flex; justify-content:space-between; font-size:14px; margin-bottom:5px; color:var(--parchment);}
  .bar-track{height:6px; background:var(--ink-3); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--amber); border-radius:4px;}
  .country-cost-row{display:flex; align-items:center; justify-content:space-between; padding:11px 8px; border-bottom:1px solid var(--hairline); border-radius:8px; cursor:pointer;}
  .country-cost-row:active{background:rgba(227,163,59,0.10);}
  .country-cost-row:last-child{border-bottom:none;}
  .ccr-left{display:flex; align-items:center; gap:10px;}
  .ccr-flag{font-size:20.5px;}
  .ccr-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .ccr-name{font-size:15px; font-weight:600; color:var(--parchment);}
  .ccr-amt{font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--amber);}
  #costDetailPane{display:none; background:var(--ink-2); border:1px solid var(--amber); border-radius:var(--radius); padding:14px; margin-top:10px;}
  .cdp-title{font-size:15px; font-weight:700; margin-bottom:10px; color:var(--amber);}
  .cdp-item{background:var(--ink-3); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; margin-bottom:7px; font-size:13px;}
  .cdpi-row{display:flex; justify-content:space-between; gap:8px;}
  .cdpi-label{flex:1; color:var(--parchment);}
  .cdpi-cost{font-family:'IBM Plex Mono',monospace; color:var(--amber); white-space:nowrap;}
  .cdpi-sub{color:var(--parchment-dim); margin-top:3px; font-size:12.5px;}

  /* OTHER / PREP TABS (shared accordion) */
  .misc{border:1px solid var(--hairline); border-radius:var(--radius); background:var(--ink-2); overflow:hidden; margin-bottom:10px;}
  .misc-head{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;}
  .misc-icon{font-size:22px;}
  .misc-name{font-size:16px; font-weight:700; flex:1; color:var(--parchment);}
  .misc-body{display:none; padding:0 14px 14px; border-top:1px solid var(--hairline);}
  .misc.open .misc-body{display:block;}
  .misc.open .chev{transform:rotate(90deg);}
  .misc-item{padding:10px 0; border-bottom:1px solid var(--hairline); font-size:14.5px; line-height:1.5; color:var(--parchment);}
  .misc-item:last-child{border-bottom:none;}
  .misc-item .mi-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber); margin-bottom:3px;}

  /* CHECKLIST + PACKING */
  .chk-row{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline);}
  .chk-row:last-child{border-bottom:none;}
  .chk-box{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--parchment-dim); flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink);}
  .chk-box.checked{background:var(--moss); border-color:var(--moss); color:var(--ink);}
  .chk-text{font-size:15px; line-height:1.4; flex:1; color:var(--parchment);}
  .chk-text.checked{color:var(--parchment-dim); text-decoration:line-through;}
  .chk-del{color:var(--rust); font-size:18.5px; cursor:pointer; padding:0 4px; flex-shrink:0;}
  .pack-cat-title{font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber); margin:16px 0 6px;}
  .add-row{display:flex; gap:7px; margin-top:14px;}
  .add-row input, .add-row select{background:var(--ink-3); border:1px solid var(--hairline); color:var(--parchment); border-radius:8px; padding:9px 10px; font-family:'Space Grotesk',sans-serif; font-size:15px;}
  .add-row input{flex:1; min-width:0;}
  .add-row input::placeholder{color:var(--parchment-dim);}
  .add-row button{background:var(--amber); color:var(--ink); border:none; border-radius:8px; padding:9px 14px; font-weight:700; font-size:15px; cursor:pointer; flex-shrink:0;}

  /* PREP ADD FAB + MODAL */
  .prep-fab{display:flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:10px; background:rgba(107,142,99,0.22); color:var(--moss); font-size:23px; font-weight:600; border:1px solid rgba(107,142,99,0.45); cursor:pointer; margin:0 auto 18px;}
  .prep-fab:active{background:rgba(107,142,99,0.32);}
  #addModalOverlay{position:fixed; inset:0; background:rgba(10,15,19,0.6); display:none; align-items:flex-end; z-index:60;}
  #addModal{background:var(--ink-2); width:100%; max-width:520px; margin:0 auto; border-radius:18px 18px 0 0; padding:20px 18px 28px; border-top:1px solid var(--hairline); position:relative;}
  #addModal .handle{width:36px; height:4px; background:var(--hairline); border-radius:4px; margin:0 auto 14px;}
  #addModal .close{position:absolute; top:14px; right:16px; background:none; border:none; color:var(--parchment-dim); font-size:20.5px; cursor:pointer;}
  .add-type-tabs{display:flex; gap:6px; margin-bottom:16px;}
  .add-type-tab{flex:1; background:var(--ink-3); border:1px solid var(--hairline); color:var(--parchment-dim); font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14.5px; padding:10px 0; border-radius:10px; cursor:pointer; text-align:center;}
  .add-type-tab.active{background:rgba(227,163,59,0.14); border-color:var(--amber); color:var(--amber);}
  .add-field{margin-bottom:12px;}
  .add-field label{display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber); margin-bottom:5px;}
  .add-field input, .add-field select{width:100%; background:var(--ink-3); border:1px solid var(--hairline); color:var(--parchment); border-radius:8px; padding:11px 12px; font-family:'Space Grotesk',sans-serif; font-size:16px;}
  .add-save-btn{width:100%; background:var(--amber); color:var(--ink); border:none; border-radius:10px; padding:13px 0; font-weight:700; font-size:16px; cursor:pointer; margin-top:6px;}
  .prep-progress{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--parchment-dim); text-align:right; margin-bottom:8px;}

  /* AUTH GATE */
  #authGate{position:fixed; inset:0; background:radial-gradient(ellipse 120% 70% at 50% 0%, #1d2a35 0%, #0c1318 55%, #060a0d 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; z-index:100; text-align:center; overflow:hidden;}
  .bat-spot{position:absolute; top:-180px; left:50%; transform:translateX(-50%); width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(227,163,59,0.22) 0%, rgba(227,163,59,0.06) 45%, transparent 70%); pointer-events:none;}
  .bat-mark{width:96px; height:96px; margin:0 auto 18px; position:relative; z-index:1; opacity:0.95;}
  .bat-eyebrow{font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.18em; color:var(--amber); margin-bottom:10px; position:relative; z-index:1;}
  #authGate h2{font-size:25px; margin:0 0 8px; position:relative; z-index:1; letter-spacing:0.01em;}
  #authGate p{font-size:15px; color:var(--parchment-dim); margin:0 0 26px; max-width:300px; line-height:1.55; position:relative; z-index:1;}

  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

<script>
const COUNTRY_META = {
  USA:{flag:"🇺🇸",name:"United States",accent:"#E0A93B"},
  Mexico:{flag:"🇲🇽",name:"Mexico",accent:"#D9714B"},
  Guatemala:{flag:"🇬🇹",name:"Guatemala",accent:"#5FA876"},
  Peru:{flag:"🇵🇪",name:"Peru",accent:"#C1463F"},
  Bolivia:{flag:"🇧🇴",name:"Bolivia",accent:"#3FB8B0"},
  Argentina:{flag:"🇦🇷",name:"Argentina",accent:"#5C9BD9"},
  Brazil:{flag:"🇧🇷",name:"Brazil",accent:"#7FBF4D"},
  China:{flag:"🇨🇳",name:"China",accent:"#A8729E"}
};

const PRIO_RANK = {"\ud83d\udea8 High":1,"\ud83d\udfe1 Medium":2,"\ud83d\udfe2 Low":3,"\ud83d\udfe2 watch":3.5,null:4};
let DATA = [];
let GENERAL_COSTS = [];

async function loadData(){
  try{
    const legs = await sb('legs?select=*&order=sort_order.asc');
    const bookingsRaw = await sb('bookings?select=*');
    const flightDetailsRaw = await sb('flight_details?select=*');
    const fdByBooking = {};
    flightDetailsRaw.forEach(function(fd){ fdByBooking[fd.booking_id] = fd; });

    const byLeg = {};
    const general = [];
    bookingsRaw.forEach(function(b){
      const item = {id:b.id, cat:b.cat, title:b.title, provider:b.provider, cost:b.cost, status:b.status, note:b.note, fd: fdByBooking[b.id] || null};
      if(b.leg_id === null){
        general.push(item);
      }else{
        if(!byLeg[b.leg_id]) byLeg[b.leg_id] = [];
        byLeg[b.leg_id].push(item);
      }
    });
    DATA = legs.map(function(l){
      return {
        id: l.id,
        country: l.country,
        loc: l.loc,
        start: l.start_label,
        end: l.end_label,
        dates: l.dates_display,
        start_date: l.start_date,
        end_date: l.end_date,
        status: l.status,
        priority: l.priority,
        plan: l.plan,
        booking: l.booking_needed,
        notes: l.notes,
        bookings: byLeg[l.id] || []
      };
    });
    GENERAL_COSTS = general;
  }catch(e){
    showSaveStatus('error loading trip data: ' + (e && e.message ? e.message : String(e)));
    DATA = [];
    GENERAL_COSTS = [];
  }
}

function statusPill(s){
  if(s==='booked') return '<span class="pill booked">booked</span>';
  if(s==='partial') return '<span class="pill partial">confirmed · unpaid</span>';
  return '<span class="pill open">not booked</span>';
}
function dotColor(s){ return s==='booked' ? 'var(--moss)' : s==='partial' ? 'var(--slate)' : 'var(--rust)'; }

function computeCritical(){
  const open = DATA.filter(d=>d.status==='open');
  open.sort((a,b)=>{
    const pa = PRIO_RANK[a.priority] ?? 4, pb = PRIO_RANK[b.priority] ?? 4;
    if(pa!==pb) return pa-pb;
    return a.id - b.id;
  });
  return open[0] || null;
}

function renderBanner(){
  const c = computeCritical();
  if(!c){ document.getElementById('bannerTitle').textContent = "Nothing urgent — everything actionable is booked."; document.getElementById('bannerMeta').textContent=''; return; }
  document.getElementById('bannerTitle').textContent = c.loc + " — " + c.dates;
  document.getElementById('bannerMeta').textContent = c.booking;
  document.getElementById('banner').onclick = function(){ openSheet(c.id); };
}

function groupByCountry(){
  const groups = [];
  const order = [];
  DATA.forEach(function(d){ if(order.indexOf(d.country)===-1) order.push(d.country); });
  order.forEach(function(cn){
    const legs = DATA.filter(function(d){ return d.country===cn; });
    groups.push({ country: cn, start: legs[0].start, end: legs[legs.length-1].end, legs: legs });
  });
  return groups;
}

function renderCountries(){
  const groups = groupByCountry();
  const el = document.getElementById('countries');
  el.innerHTML = groups.map(function(g,i){
    const meta = COUNTRY_META[g.country] || {flag:"🏳️",name:g.country,accent:"#B9B2A0"};
    const bars = g.legs.map(function(l){ return '<i style="background:'+dotColor(l.status)+'"></i>'; }).join('');
    const legsHtml = g.legs.map(function(l){
      const bkCount = (l.bookings && l.bookings.length) ? l.bookings.length : 0;
      return '<div class="leg" onclick="event.stopPropagation(); openSheet('+l.id+')">'
        + '<div class="leg-card" style="--barcolor:'+meta.accent+'">'
        + '<div class="leg-top"><div><div class="leg-loc">'+l.loc+'</div>'
        + '<div class="leg-dates">'+l.dates+'</div></div>'+statusPill(l.status)+'</div>'
        + (l.priority ? '<div class="prio mono">priority: '+l.priority+'</div>' : '')
        + (bkCount ? '<div class="booking-badge">🧾 '+bkCount+' booking'+(bkCount>1?'s':'')+'</div>' : '')
        + '</div></div>';
    }).join('');
    return '<div class="country" id="country-'+i+'" style="--accent:'+meta.accent+'; --accent-soft:'+meta.accent+'26;">'
      + '<div class="country-head" onclick="toggleCountry('+i+')">'
      + '<div class="country-flag">'+meta.flag+'</div>'
      + '<div class="country-main"><div class="country-name">'+meta.name+'</div>'
      + '<div class="country-dates mono">'+g.start+' – '+g.end+'</div></div>'
      + '<div class="country-status"><div class="status-bar">'+bars+'</div><div class="chev">›</div></div>'
      + '</div><div class="country-body">'+legsHtml+'</div></div>';
  }).join('');
}

function renderCalendar(){
  const el = document.getElementById('tab-calendar');
  if(!el) return;
  const months = [
    {y:2026, m:6, label:'July 2026'},
    {y:2026, m:7, label:'August 2026'},
    {y:2026, m:8, label:'September 2026'},
    {y:2026, m:9, label:'October 2026 (partial)'}
  ];
  const todayStr = new Date().toISOString().slice(0,10);

  const dateMap = {};
  const dateCount = {};
  DATA.forEach(function(d){
    if(!d.start_date) return;
    const endStr = d.end_date || d.start_date;
    let cur = new Date(d.start_date+'T00:00:00');
    const endD = new Date(endStr+'T00:00:00');
    while(cur <= endD){
      const key = cur.toISOString().slice(0,10);
      dateCount[key] = (dateCount[key]||0) + 1;
      dateMap[key] = {country:d.country, legId:d.id, loc:d.loc};
      cur = new Date(cur.getTime() + 86400000);
    }
  });

  const legend = Object.keys(COUNTRY_META).map(function(c){
    const meta = COUNTRY_META[c];
    return '<div class="cal-legend-item"><i style="background:'+meta.accent+';"></i>'+meta.flag+' '+c+'</div>';
  }).join('') + '<div class="cal-legend-item">✈️ travel day</div>';

  const monthsHtml = months.map(function(mo){
    const firstDow = new Date(mo.y, mo.m, 1).getDay();
    const daysInMonth = new Date(mo.y, mo.m+1, 0).getDate();
    let cells = '';
    for(let i=0;i<firstDow;i++){ cells += '<div class="cal-day empty"></div>'; }
    for(let day=1; day<=daysInMonth; day++){
      const dateObj = new Date(mo.y, mo.m, day);
      const key = dateObj.toISOString().slice(0,10);
      const info = dateMap[key];
      const meta = info ? (COUNTRY_META[info.country] || {accent:'#777'}) : null;
      const isToday = key === todayStr;
      const isTransit = info && dateCount[key] > 1;
      const style = meta ? ('background:'+meta.accent+'2E; border-color:'+meta.accent+';') : '';
      const onclick = info ? (' onclick="openSheet('+info.legId+')"') : '';
      cells += '<div class="cal-day'+(isToday?' today':'')+(info?' has-leg':'')+'" style="'+style+'"'+onclick+'>'
        + day + (isTransit ? '<span class="cal-plane">✈️</span>' : '')
        + '</div>';
    }
    return '<div class="cal-month"><div class="cal-month-title">'+mo.label+'</div>'
      + '<div class="cal-dow">'+['S','M','T','W','T','F','S'].map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>'
      + '<div class="cal-grid">'+cells+'</div></div>';
  }).join('');

  el.innerHTML = '<div class="cal-legend">'+legend+'</div>' + monthsHtml;
}

function toggleCountry(i){
  document.getElementById('country-'+i).classList.toggle('open');
}

function jumpToCountry(i){
  showMainTab('itinerary');
  const el = document.getElementById('country-'+i);
  if(!el) return;
  el.classList.add('open');
  el.scrollIntoView({behavior:'smooth', block:'start'});
}

function renderRail(){
  const groups = groupByCountry();
  const rail = document.getElementById('rail');
  const caption = document.getElementById('railCaption');
  if(!groups.length){ rail.innerHTML=''; caption.textContent=''; return; }

  const NOMINAL_OPEN_DAYS = 14; // for legs with no end_date yet (e.g. China TBD)
  const spans = groups.map(function(g){
    const firstLeg = g.legs[0], lastLeg = g.legs[g.legs.length-1];
    const start = firstLeg.start_date ? new Date(firstLeg.start_date+'T00:00:00') : null;
    let end = lastLeg.end_date ? new Date(lastLeg.end_date+'T00:00:00') : null;
    if(!end && start) end = new Date(start.getTime() + NOMINAL_OPEN_DAYS*86400000);
    const days = (start && end) ? Math.max(1, Math.round((end-start)/86400000)) : 1;
    return {country: g.country, start: start, end: end, days: days};
  });
  const totalDays = spans.reduce(function(s,x){ return s+x.days; }, 0);
  const overallStart = spans[0].start;
  const overallEnd = spans[spans.length-1].end;

  rail.innerHTML = spans.map(function(s, i){
    const meta = COUNTRY_META[s.country] || {accent:"#B9B2A0"};
    const pct = (s.days/totalDays*100).toFixed(2);
    return '<div class="rail-seg" style="width:'+pct+'%; background:'+meta.accent+';" onclick="jumpToCountry('+i+')"></div>';
  }).join('');

  const today = new Date(); today.setHours(0,0,0,0);
  if(overallStart && overallEnd && today >= overallStart && today <= overallEnd){
    const pct = ((today-overallStart)/(overallEnd-overallStart)*100).toFixed(2);
    rail.insertAdjacentHTML('beforeend', '<div class="rail-marker" style="left:'+pct+'%;"></div>');
    const here = DATA.find(function(d){ return d.start_date && d.end_date && (new Date().toISOString().slice(0,10))>=d.start_date && (new Date().toISOString().slice(0,10))<=d.end_date; });
    caption.innerHTML = here ? ('You are here: <b>'+here.loc+'</b>') : '';
  }else if(overallStart && today < overallStart){
    const daysToGo = Math.ceil((overallStart-today)/86400000);
    caption.innerHTML = '<b>'+daysToGo+' days</b> until departure';
  }else{
    caption.innerHTML = '';
  }
}

function bkStatusPill(s){
  if(s==='paid') return '<span class="pill paid">paid</span>';
  if(s==='confirmed') return '<span class="pill confirmed">confirmed · unpaid</span>';
  return '<span class="pill reserved">reserved</span>';
}

function renderBookings(d){
  const pane = document.getElementById('paneBookings');
  const list = d.bookings || [];
  if(!list.length){
    pane.innerHTML = '<div class="bk-empty">Nothing booked here yet.</div>';
    return;
  }
  pane.innerHTML = list.map(function(b){
    const isFlight = b.cat === '✈️' && b.fd;
    return '<div class="bk-item"'+(isFlight ? ' onclick="toggleFlightDetail('+b.id+')" style="cursor:pointer;"' : '')+'>'
      + '<div class="bk-top"><div class="bk-title">'+b.cat+' '+b.title+'</div>'
      + '<div class="bk-cost">'+(b.cost||'')+'</div></div>'
      + '<div class="bk-provider">'+(b.provider||'')+'</div>'
      + (b.note ? '<div class="bk-note">'+b.note+'</div>' : '')
      + '<div class="bk-status">'+bkStatusPill(b.status)+(isFlight ? ' <span class="mono" style="font-size:10.5px; color:var(--amber); margin-left:6px;">tap for flight details ›</span>' : '')+'</div>'
      + (isFlight ? '<div class="flight-detail" id="fd-'+b.id+'" style="display:none; margin-top:10px; padding-top:10px; border-top:1px dashed var(--hairline);">' + renderFlightDetail(b.fd) + '</div>' : '')
      + '</div>';
  }).join('');
  document.getElementById('tabBookings').textContent = 'Bookings (' + list.length + ')';
}

function renderFlightDetail(fd){
  const rows = [];
  if(fd.flight_number || fd.airline) rows.push(['Flight', [fd.airline, fd.flight_number].filter(Boolean).join(' ')]);
  if(fd.aircraft_type) rows.push(['Aircraft', fd.aircraft_type]);
  if(fd.departure_airport) rows.push(['Departs', fd.departure_airport + (fd.departure_terminal ? ' · ' + fd.departure_terminal : '')]);
  if(fd.arrival_airport) rows.push(['Arrives', fd.arrival_airport + (fd.arrival_terminal ? ' · ' + fd.arrival_terminal : '')]);
  if(fd.duration) rows.push(['Duration', fd.duration]);
  if(fd.route_notes) rows.push(['Route', fd.route_notes]);
  if(fd.seat) rows.push(['Seat', fd.seat]);
  if(fd.confirmation_number) rows.push(['Confirmation', fd.confirmation_number]);
  if(fd.baggage_policy) rows.push(['Baggage', fd.baggage_policy]);
  if(fd.checkin_notes) rows.push(['Check-in', fd.checkin_notes]);
  if(fd.public_notes) rows.push(['Notes', fd.public_notes]);
  const hero = (fd.departure_time || fd.arrival_time) ? (
    '<div class="fd-hero">'
      + '<div class="fd-hero-side"><div class="fd-hero-time">'+(fd.departure_time||'—')+'</div><div class="fd-hero-port">'+(shortPort(fd.departure_airport))+'</div></div>'
      + '<div class="fd-hero-mid"><div class="fd-hero-arrow">✈️ →</div>'+(fd.duration ? '<div class="fd-hero-dur">'+fd.duration+'</div>' : '')+'</div>'

const ICON_CATEGORY = {"🏨":"Accommodation","✈️":"Flights","🎟️":"Activities & Tours","🚆":"Transport","🚌":"Transport","🚐":"Transport","🚗":"Transport","📄":"Documents & Health","💊":"Documents & Health"};

function parseCost(str){
  if(!str) return 0;
  const n = parseFloat(String(str).replace(/[^0-9.]/g,''));
  return isNaN(n) ? 0 : n;
}

function allBookingsFlat(){
  const out = [];
  DATA.forEach(function(d){
    (d.bookings||[]).forEach(function(b){ out.push(Object.assign({}, b, {country:d.country})); });
  });
  GENERAL_COSTS.forEach(function(b){ out.push(Object.assign({}, b, {country:"General"})); });
  return out;
}

function computeCostSummary(){
  const items = allBookingsFlat();
  const sum = {paid:0, confirmed:0, reserved:0, total:0};
  const byCategory = {};
  const byCountry = {};
  items.forEach(function(b){
    const v = parseCost(b.cost);
    sum.total += v;
    if(b.status==='paid') sum.paid += v;
    else if(b.status==='confirmed') sum.confirmed += v;
    else sum.reserved += v;
    const cat = ICON_CATEGORY[b.cat] || "Other";
    byCategory[cat] = (byCategory[cat]||0) + v;
    byCountry[b.country] = (byCountry[b.country]||0) + v;
  });
  return {sum, byCategory, byCountry};
}

function fmtAud(n){ return '$' + n.toLocaleString('en-AU', {minimumFractionDigits:0, maximumFractionDigits:0}); }

let currentDetailKey = null;
function showCostDetail(type, key){
  const pane = document.getElementById('costDetailPane');
  if(currentDetailKey === type+':'+key){

    return type==='category' ? (ICON_CATEGORY[b.cat]||'Other')===key : b.country===key;

  pane.innerHTML = '<div class="cdp-title">'+title+' · '+fmtAud(items.reduce(function(s,b){return s+parseCost(b.cost);},0))+'</div>'
    + items.map(function(b){

}

async function sb(path, options){
  options = options || {};
  let authHeader = 'Bearer ' + SUPABASE_KEY;
  try{
    const { data: { session } } = await authClient.auth.getSession();
    if(session && session.access_token) authHeader = 'Bearer ' + session.access_token;
  }catch(e){ /* fall back to anon key for unauthenticated reads */ }
  const headers = Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': authHeader,
    'Content-Type': 'application/json'
  }, options.headers || {});
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, options, {headers: headers}));
  if(!res.ok){
    const txt = await res.text().catch(function(){ return res.statusText; });
    throw new Error('Supabase ' + res.status + ': ' + txt);
  }
  if(res.status === 204) return null;
  return res.json();
}

function getCurrentLeg(){
  const today = new Date(); today.setHours(0,0,0,0);
  const todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  let match = DATA.find(function(d){ return d.start_date && d.end_date && todayStr>=d.start_date && todayStr<=d.end_date; });
  if(!match){
    // open-ended leg (e.g. China TBD with no end_date) or before/after trip — fall back to nearest
    const openEnded = DATA.filter(function(d){ return d.start_date && !d.end_date && todayStr>=d.start_date; });
    if(openEnded.length) match = openEnded[openEnded.length-1];
  }
  if(!match && DATA.length && DATA[0].start_date && todayStr < DATA[0].start_date) match = null; // before trip starts
  return match || null;
}
function switchAddType(type){
  addModalType = type;
  document.getElementById('addTypePacking').classList.toggle('active', type==='packing');
  document.getElementById('addTypePrep').classList.toggle('active', type==='prep');
  document.getElementById('addTypeCost').classList.toggle('active', type==='cost');
  document.getElementById('addFieldsPacking').style.display = type==='packing' ? 'block' : 'none';
  document.getElementById('addFieldsPrep').style.display = type==='prep' ? 'block' : 'none';
  document.getElementById('addFieldsCost').style.display = type==='cost' ? 'block' : 'none';
  if(type==='cost'){
    const leg = getCurrentLeg();
    const countrySel = document.getElementById('addCostCountryInput');
    countrySel.value = leg ? leg.country : 'General';
  }
}
async function submitAddModal(){
  let ok = false;
  if(addModalType === 'packing'){
    const cat = document.getElementById('addPackCatInput').value;
    const text = document.getElementById('addPackTextInput').value;
    ok = await addPackItem(cat, text);
  }else if(addModalType === 'prep'){

  }else if(addModalType === 'cost'){
    const cat = document.getElementById('addCostCatInput').value;
    const amount = document.getElementById('addCostAmountInput').value;
    const country = document.getElementById('addCostCountryInput').value;
    const note = document.getElementById('addCostNoteInput').value;

  }
}
async function addCostEntry(cat, amount, country, note){
  const amt = parseFloat(amount);
  if(!amt || amt <= 0) return false;
  const leg = getCurrentLeg();
  const legId = (country==='General') ? null : (leg && leg.country===country ? leg.id : null);
  const catName = ICON_CATEGORY[cat] || 'Other';
  const title = (note && note.trim()) ? note.trim() : (catName + ' expense');
  const costStr = '$' + amt.toLocaleString('en-AU', {minimumFractionDigits: (amt % 1 !== 0) ? 2 : 0, maximumFractionDigits:2});
  try{
    const inserted = await sb('bookings', {
      method:'POST',
      headers:{'Prefer':'return=representation'},
      body: JSON.stringify({leg_id: legId, cat: cat, title: title, cost: costStr, status:'paid', note: (note && note.trim()) ? note.trim() : null})
    });
    const item = {id:inserted[0].id, cat:inserted[0].cat, title:inserted[0].title, provider:null, cost:inserted[0].cost, status:inserted[0].status, note:inserted[0].note, fd:null};
    if(legId){
      const d = DATA.find(function(x){ return x.id===legId; });
      if(d) d.bookings.push(item);
    }else{
      GENERAL_COSTS.push(Object.assign({}, item, {country: country==='General' ? 'General' : country}));
    }
    showSaveStatus('saved'); lastFailedSave = null;
    return true;
  }catch(e){
    showSaveStatus('error: ' + e.message);
    return false;
  }
}

  document.getElementById('sideNav').classList.add('open');
  document.getElementById('sideNavOverlay').classList.add('open');
}
function closeSideNav(){
  document.getElementById('sideNav').classList.remove('open');
  document.getElementById('sideNavOverlay').classList.remove('open');
}
function navigateTo(tab){
  showMainTab(tab);
  closeSideNav();
  window.scrollTo({top:0, behavior:'instant'});
}

const TRIP_START = new Date("2026-07-14T09:10:00+10:00");
function tickCountdown(){
  const now = new Date();
  let diff = TRIP_START - now;
  if(diff < 0) diff = 0;
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  document.getElementById('cdDays').textContent = days;
  document.getElementById('cdHours').textContent = String(hours).padStart(2,'0');
  document.getElementById('cdMins').textContent = String(mins).padStart(2,'0');
  document.getElementById('cdSecs').textContent = String(secs).padStart(2,'0');
}

async function initDashboard(){
  await loadData();
  await loadPrep();
  document.getElementById('retrySaveBtn').onclick = retrySave;
  const bookedCount = DATA.filter(function(d){ return d.status==='booked'; }).length;
  document.getElementById('dayCount').textContent = bookedCount+'/'+DATA.length+' legs locked';
  renderBanner();
  renderCountries();
  renderRail();
  renderCalendar();
  renderCosts();
  renderPrep();
  renderOther();
  tickCountdown();
  setInterval(tickCountdown, 1000);
}

const AUTHORIZED_GITHUB_USERNAME = 'agouz';
const authClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function setGate(html){
  document.getElementById('authGateContent').innerHTML = html;
  document.getElementById('authGate').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

async function doLogin(){
  const cleanUrl = window.location.origin + window.location.pathname;
  await authClient.auth.signInWithOAuth({
    provider: 'github',
    options: { redirectTo: cleanUrl }
  });
}
async function doLogout(){
  await authClient.auth.signOut();
  window.location.reload();
}

function getUrlAuthError(){
  const hash = window.location.hash || '';
  const search = window.location.search || '';
  const params = new URLSearchParams(hash.replace(/^#/, '') || search.replace(/^\?/, ''));
  const err = params.get('error_description') || params.get('error');
  return err ? decodeURIComponent(err.replace(/\+/g, ' ')) : null;
}

async function checkAuthAndInit(){
  const urlErr = getUrlAuthError();
  const { data: { session } } = await authClient.auth.getSession();

  if(!session){
    setGate(
      '<div class="bat-eyebrow">Wayne Enterprises · Travel Division</div>'
      + '<h2>The signal\'s up.</h2>'
      + '<p>Gotham\'s waiting and so is the itinerary. Sign in to access the manifest — Alfred already packed your bags.</p>'
      + (urlErr ? '<p style="color:var(--rust); font-size:14px;">Login didn\'t complete: ' + urlErr + '</p>' : '')
      + (window.navigator.standalone ? '<p style="color:var(--parchment-dim); font-size:12.5px;">Tip: if this keeps bouncing back to login from the home screen icon, GitHub\'s sign-in page may be opening in Safari instead of staying in this app — a known iOS limitation. Try logging in once from a regular Safari tab at this same URL.</p>' : '')
      + '<button class="gh-login-btn" onclick="doLogin()">'
        + '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>'
        + 'Enter the Batcave'
      + '</button>'
      + '<div class="bat-footer">Authorized personnel only · Gotham City, 14 Jul</div>'
    );
    return;
  }

  const meta = session.user.user_metadata || {};
  const username = meta.user_name || meta.preferred_username || '';

  if(username.toLowerCase() !== AUTHORIZED_GITHUB_USERNAME.toLowerCase()){
    await authClient.auth.signOut();
    setGate(
      '<div class="bat-eyebrow">Access Denied</div>'
      + '<h2>Not even Robin gets in.</h2>'
      + '<p>This GitHub account (' + (username || 'unknown') + ') isn\'t on Alfred\'s list.</p>'
      + '<button class="gh-login-btn" onclick="doLogin()">Try a different account</button>'
    );
    return;
  }

  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  await initDashboard();
}

authClient.auth.onAuthStateChange(function(event, session){
  if(event === 'SIGNED_IN' || event === 'SIGNED_OUT'){
    checkAuthAndInit();
  }
});

checkAuthAndInit();
</script>
