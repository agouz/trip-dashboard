<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Gotham Itinerary" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#08101A" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="manifest" href="manifest.json" />
<title>Gotham Itinerary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,300;1,9..144,700&family=Figtree:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="map-d3.min.js" defer></script>
<script src="map-topojson-client.min.js" defer></script>
<style>
  :root{
    --ink:#08101A; --ink-2:#0F1C28; --ink-3:#172433;
    --parchment:#F2E8D0; --parchment-dim:#7A7468;
    --amber:#D4A847; --moss:#5A9E72; --rust:#C0523C; --slate:#4A7A9B;
    --jade:#5DB89A; --hairline:rgba(242,232,208,0.10); --radius:0px;
  }

  @keyframes tileReveal{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .country{animation:tileReveal 0.45s cubic-bezier(0.22,1,0.36,1) both;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{background-color:#08101A; background-color:var(--ink);}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--parchment); font-family:'Figtree',sans-serif; height:100%; overflow:hidden;}
  .mono{font-family:'Fira Code',monospace; letter-spacing:0.02em;}
  #app{max-width:520px; margin:0 auto; display:flex; flex-direction:column; height:100%; height:100svh; background:var(--ink); background-image:radial-gradient(ellipse 80% 50% at 50% 0%, rgba(93,184,154,0.06) 0%, transparent 70%); overflow:hidden;}

  #mainContent{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding-top:calc(env(safe-area-inset-top) + 16px); padding-bottom:100px; overscroll-behavior:contain;}
  header.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; padding:0 16px 16px; border-bottom:1px solid var(--hairline);}
  header.top .tag{font-family:'Fira Code',monospace; font-size:10.5px; color:var(--jade); border:1px solid var(--jade); padding:3px 8px; border-radius:0; white-space:nowrap; letter-spacing:0.06em;}
  .auth-gate-title{font-size:24px; font-weight:900; letter-spacing:-0.03em; color:var(--amber); margin:14px 0 0; position:relative; z-index:1; font-family:'Fraunces',serif; font-style:italic;}
  .trip-name{font-size:24px; font-weight:900; letter-spacing:-0.03em; color:var(--amber); font-family:'Fraunces',serif; font-style:italic;}
  .hamburger-btn{width:40px; height:40px; border-radius:9px; background:var(--ink-2); border:1px solid var(--hairline); color:var(--parchment); font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;}

  .bottom-tab-bar{position:relative; flex-shrink:0; background:rgba(8,16,26,0.98); border-top:1px solid var(--hairline); display:flex; align-items:center; justify-content:space-around; z-index:10; padding-bottom:env(safe-area-inset-bottom); height:calc(62px + env(safe-area-inset-bottom));}
  .btab{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0; cursor:pointer; color:rgba(242,232,208,0.35); transition:color 0.18s ease; -webkit-tap-highlight-color:transparent; min-width:0; position:relative;}
  .btab svg{width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1);}
  .btab-pill{position:absolute; inset:auto; width:52px; height:32px; border-radius:16px; background:transparent; transition:background 0.2s cubic-bezier(0.34,1.56,0.64,1); pointer-events:none; top:50%; transform:translateY(-50%);}
  .btab.active{color:var(--amber);}
  .btab.active .btab-pill{background:rgba(212,168,71,0.18);}
  .btab.active svg{transform:scale(1.12);}
 opacity:0; pointer-events:none; transition:opacity 0.22s ease;}
  .side-nav-overlay.open{opacity:1; pointer-events:auto;}
  .side-nav{position:fixed; top:0; left:0; bottom:0; width:78%; max-width:300px; background:var(--ink-2); border-right:1px solid var(--hairline); z-index:200; transform:translateX(-105%); transition:transform 0.25s ease; padding:18px 14px; display:flex; flex-direction:column; box-shadow:8px 0 28px rgba(0,0,0,0.4);}
  .side-nav.open{transform:translateX(0);}
  .side-nav-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--hairline);}
  .side-nav-brand{font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .side-nav-close{background:none; border:none; color:var(--parchment-dim); font-size:22px; cursor:pointer; line-height:1;}
  .side-nav-item{display:flex; align-items:center; gap:12px; padding:13px 12px; border-radius:10px; color:var(--parchment-dim); font-weight:600; font-size:15px; cursor:pointer; margin-bottom:3px;}
  .side-nav-item .sn-ic{font-size:17px; width:22px; text-align:center;}
  .side-nav-item.active{background:rgba(227,163,59,0.14); color:var(--amber);}
  .side-nav-item.logout{color:var(--rust);}
  .side-nav-spacer{flex:1;}
  .sn-divider{height:1px; background:var(--hairline); margin:8px 0;}
  .info-page-title{font-size:26px; font-weight:800; margin-bottom:6px; letter-spacing:-0.02em;}
  .info-page-sub{font-size:13.5px; color:var(--parchment-dim); margin-bottom:24px; font-family:'Fira Code',monospace; line-height:1.5;}
  .info-card{background:var(--ink-2); border:1px solid var(--hairline); border-radius:0; padding:18px 16px; margin-bottom:2px; position:relative; overflow:hidden;}
  .info-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--card-accent, var(--hairline));}
  .info-card-label{font-family:'Fira Code',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber); margin-bottom:8px;}
  .info-card-val{font-size:14.5px; line-height:1.7; color:var(--parchment);}
  .info-card-status{display:inline-block; font-family:'Fira Code',monospace; font-size:10px; padding:2px 8px; border-radius:20px; margin-top:8px;}
  .info-card-status.done{background:rgba(107,142,99,0.18); color:var(--moss); border:1px solid rgba(107,142,99,0.4);}
  .info-card-status.pending{background:rgba(227,163,59,0.18); color:var(--amber); border:1px solid rgba(227,163,59,0.4);}
  .info-section-head{font-family:'Fira Code',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--parchment-dim); margin:22px 0 10px;}
  .sn-info-label{font-family:'Fira Code',monospace; font-size:10px; color:var(--amber); text-transform:uppercase; letter-spacing:0.06em; margin-bottom:2px;}


  .banner{background:var(--ink-2); border:none; border-left:3px solid var(--rust); border-radius:0; padding:13px 16px; margin-bottom:2px; cursor:pointer;}
  .banner .eyebrow{font-family:'Fira Code',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:var(--rust); margin-bottom:5px;}
  .banner .title{font-size:20px; font-weight:900; margin-bottom:4px; color:var(--parchment); letter-spacing:-0.02em; font-family:'Fraunces',serif;}
  .banner .meta{font-size:13px; color:var(--parchment-dim);}

  #countries{display:grid; grid-template-columns:1fr; gap:2px; background:var(--hairline);}
  .country{position:relative; border:none; border-radius:0; background:var(--ink-2); overflow:hidden;}
  .country::before{display:none;}
  .country-head{cursor:pointer; overflow:hidden; border-radius:0; position:relative;}
  .country-strip{display:flex; align-items:center; padding:14px 14px 12px; background:var(--accent); gap:12px; background-image:linear-gradient(135deg,rgba(0,0,0,0.18) 0%,rgba(0,0,0,0.0) 60%);}
  .country-strip-flag{font-size:28px; line-height:1; flex-shrink:0; filter:drop-shadow(0 1px 3px rgba(0,0,0,0.3));}
  .country-strip-info{flex:1; min-width:0;}
  .country-strip-name{font-size:22px; font-weight:900; color:#fff; line-height:1.05; letter-spacing:-0.02em; text-shadow:0 2px 8px rgba(0,0,0,0.4); font-family:'Fraunces',serif;}
  .country-strip-days{font-family:'Fira Code',monospace; font-size:10.5px; color:rgba(255,255,255,0.72); margin-top:3px; letter-spacing:0.04em;}
  .country-strip-dates{font-family:'Fira Code',monospace; font-size:13px; color:rgba(255,255,255,0.88); text-align:right; flex-shrink:0; line-height:1.55; letter-spacing:0.01em;}
  .country-strip-chev{font-size:18px; color:rgba(255,255,255,0.5); margin-left:6px; flex-shrink:0; transition:transform 0.2s; display:inline-block;}
  .country.open .country-strip-chev{transform:rotate(90deg);}
  .country-img{width:100%; height:180px; object-fit:cover; display:block;}
  .chev{font-size:15px; color:var(--parchment-dim); transition:transform 0.2s ease;}
  .country.open .chev{transform:rotate(90deg);}
  .country-body{display:none; padding:12px 0 18px 0; border-top:1px solid var(--hairline); margin:0;}
  .country.open .country-body{display:block;} .country.open{border-radius:0; margin:0; border-left:none; border-right:none; background:var(--ink-2);}


  .rail-wrap{margin-bottom:16px;}
  .rail{display:flex; height:11px; border-radius:8px; overflow:hidden; gap:2px; position:relative;}
  .rail-seg{height:100%; border-radius:2px; cursor:pointer; opacity:0.85; transition:opacity 0.15s ease;}
  .rail-seg:active{opacity:1;}
  .rail-marker{position:absolute; top:-4px; width:2px; height:17px; background:var(--parchment); border-radius:1px; pointer-events:none;}
  .rail-caption{font-family:'Fira Code',monospace; font-size:11.5px; color:var(--parchment-dim); margin-top:6px; text-align:center;}
  .rail-caption b{color:var(--parchment);}

  .leg{position:relative; margin-top:0; cursor:pointer; padding:0;}
  .leg-card{background:var(--ink-3); border-top:1px solid var(--hairline); border-bottom:none; border-left:none; border-right:none; border-radius:0; padding:14px 16px; position:relative; overflow:hidden;}
  .leg-card::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--barcolor, var(--parchment-dim));}
  .leg-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .leg-loc{font-size:17px; font-weight:700; letter-spacing:-0.01em;}
  .leg-dates{font-family:'Fira Code',monospace; font-size:12px; color:var(--parchment-dim); margin-top:4px;}
  .leg-plan-preview{font-size:13px; color:var(--parchment-dim); margin-top:8px; line-height:1.5; opacity:0.8;}
  .leg-bk-row{display:flex; align-items:center; gap:6px; margin-top:8px;}
  .leg-bk-dot{width:6px; height:6px; border-radius:50%; background:var(--moss); flex-shrink:0;}
  .leg-bk-label{font-family:'Fira Code',monospace; font-size:10px; color:var(--moss);}
  .pill{font-family:'Fira Code',monospace; font-size:10px; padding:3px 8px; border-radius:0; white-space:nowrap; text-transform:uppercase; letter-spacing:0.05em; font-weight:700;}
  .pill.booked{background:#6B8E63; color:#fff; border:none;}
  .pill.partial{background:#E3A33B; color:#16222C; border:none;}
  .pill.open{background:#C1573D; color:#fff; border:none;}


  .sheet-header{margin-bottom:16px;}
  .sheet-header-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:4px;}
  .sheet-header-top h2{margin:0; font-size:23px; font-weight:800; letter-spacing:-0.02em; flex:1;}
  .day-list{display:flex; flex-direction:column; gap:2px; margin-bottom:16px;}
  .day-list-item{display:flex; align-items:center; gap:12px; padding:14px 4px; border-bottom:1px solid var(--hairline); cursor:pointer;}
  .day-list-item:last-child{border-bottom:none;}
  .day-list-date{font-family:'Fira Code',monospace; font-size:11px; color:var(--parchment-dim); width:52px; flex-shrink:0; line-height:1.3;}
  .day-list-headline{font-size:15px; font-weight:600; flex:1; line-height:1.3; color:var(--parchment);}
  .day-list-chev{font-size:13px; color:var(--parchment-dim); opacity:0.4;}
  .day-bullet{display:flex; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--hairline);}
  .day-bullet:last-child{border-bottom:none;}
  .day-bullet-icon{font-size:18px; flex-shrink:0; width:24px; text-align:center; margin-top:1px;}
  .day-bullet-text{font-size:16px; line-height:1.5; color:var(--parchment); flex:1;}
  .sheet-tab{flex:1; background:var(--ink-3); border:none; border-top:1px solid var(--hairline); border-right:1px solid var(--hairline); color:var(--parchment-dim); font-family:'Figtree',sans-serif; font-weight:600; font-size:14px; padding:12px 0; border-radius:0; cursor:pointer; text-align:center; min-width:0;}
  .sheet-tab:last-child{border-right:none;}
  .sheet-tab.active{background:var(--ink-2); border-top:2px solid var(--jade); color:var(--jade);}
  .bk-item{background:var(--ink-3); border-top:1px solid var(--hairline); border-radius:0; padding:11px 16px; margin-bottom:0;}
  .bk-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .bk-title{font-size:16px; font-weight:700; display:flex; gap:7px; align-items:flex-start; line-height:1.35;}
  .bk-cost{font-family:'Fira Code',monospace; font-size:15px; color:var(--amber); white-space:nowrap;}
  .bk-provider{font-size:13px; color:var(--parchment-dim); margin-top:4px;}
  .bk-note{font-size:13.5px; color:var(--parchment-dim); margin-top:6px; line-height:1.6;}
  .bk-status{display:inline-block; margin-top:6px;}
  .pill.paid{background:#6B8E63; color:#fff; border:none;}
  .pill.confirmed{background:#E3A33B; color:#16222C; border:none;}
  .pill.reserved{background:#4D7A95; color:#fff; border:none;}
  .bk-empty{font-size:14.5px; color:var(--parchment-dim); text-align:center; padding:22px 0;}
  .fd-hero{display:flex; align-items:center; justify-content:space-between; background:var(--ink); border:1px solid var(--hairline); border-radius:10px; padding:12px 10px; margin-bottom:10px;}
  .fd-hero-side{flex:1; text-align:center;}
  .fd-hero-time{font-family:'Fira Code',monospace; font-size:25.5px; font-weight:700; color:var(--parchment); line-height:1.1;}
  .fd-hero-port{font-size:12px; color:var(--parchment-dim); margin-top:5px; line-height:1.3;}
  .fd-hero-mid{flex:0 0 auto; padding:0 8px; text-align:center;}
  .fd-hero-arrow{color:var(--amber); font-size:16px;}
  .fd-hero-dur{font-family:'Fira Code',monospace; font-size:10.5px; color:var(--parchment-dim); margin-top:2px; white-space:nowrap;}

  #overlay{position:fixed; inset:0; background:rgba(10,15,19,0.6); display:none; align-items:flex-end; z-index:50;}
  #sheet{background:var(--ink-2); width:100%; max-width:520px; margin:0 auto; border-radius:0; padding:0; border-top:1px solid var(--hairline); max-height:88vh; overflow-y:scroll; position:relative; -webkit-overflow-scrolling:touch;}
  #sheet .handle{width:36px; height:4px; background:var(--hairline); border-radius:4px; margin:0 auto 14px;}
  #sheet h2{font-size:23px; margin:0 0 3px; font-weight:800; letter-spacing:-0.02em;}
  #sheet .dates{font-family:'Fira Code',monospace; font-size:13px; color:var(--parchment-dim); margin-bottom:16px;}
  #sheet .row{margin-bottom:12px; padding:0 16px;}
  #sheet .row .label{font-family:'Fira Code',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber); margin-bottom:5px;}
  #sheet .row .val{font-size:15.5px; line-height:1.65; color:var(--parchment);}
  #sPlan{padding:14px 16px 2px;}
  #sheet .close{position:absolute; top:14px; right:16px; background:none; border:none; color:var(--parchment-dim); font-size:20.5px; cursor:pointer;}
  .day-card{display:flex; gap:11px; margin-bottom:10px; align-items:flex-start;}
  .day-card-date{flex-shrink:0; width:44px; text-align:center; padding-top:2px;}
  .day-card-date .dc-dow{font-family:'Fira Code',monospace; font-size:9px; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber);}
  .day-card-date .dc-day{font-size:20px; font-weight:700; line-height:1; color:var(--parchment);}
  .day-card-date .dc-mon{font-family:'Fira Code',monospace; font-size:9px; color:var(--parchment-dim); margin-top:1px;}
  .day-card-body{flex:1; background:var(--ink-3); border:1px solid var(--hairline); border-radius:0; padding:10px 12px; position:relative; overflow:hidden;}
  .day-card-body::before{content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent, var(--hairline)); border-radius:3px 0 0 3px;}
  .day-card-title{font-size:13px; font-weight:700; color:var(--parchment); margin-bottom:4px; line-height:1.3;}
  .day-card-detail{font-size:12.5px; color:var(--parchment-dim); line-height:1.55;}
  .day-card.today .day-card-body{border-color:var(--accent, var(--amber)); box-shadow:0 0 0 1px var(--accent, var(--amber))22;}
  .day-card.today .day-card-date .dc-day{color:var(--accent, var(--amber));}

  .empty-note{font-size:13.5px; color:var(--parchment-dim); text-align:center; margin-top:38px; margin-bottom:20px; line-height:1.8; letter-spacing:0.01em; font-family:'Fira Code',monospace;}

  /* COUNTDOWN */
  .countdown{display:flex; align-items:flex-end; justify-content:center; gap:1.2vw; margin-bottom:16px; width:100%;}
  .cd-unit{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .cd-tiles{display:flex; gap:1vw;}
  .cd-tile{width:9vw; height:13vw; max-width:50px; max-height:70px; background:var(--ink-2); border:1px solid var(--hairline); border-radius:8px; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; perspective:200px;}
  .cd-tile::after{content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,0.4); z-index:2; pointer-events:none;}
  .cd-tile span{font-family:'Fira Code',monospace; font-size:6.5vw; font-weight:700; color:var(--amber); line-height:1; display:block; transition:transform 0.22s ease-in; transform-origin:center center; will-change:transform; max-font-size:34px;}
  .cd-label{font-size:2.2vw; text-transform:uppercase; letter-spacing:0.1em; color:var(--parchment-dim); margin-top:4px; max-font-size:11px;}
  .cd-colon{font-family:'Fira Code',monospace; font-size:5.5vw; font-weight:700; color:var(--parchment-dim); opacity:0.5; padding-bottom:5vw; line-height:1;}

  /* MAIN TABS */
  .map-toolbar{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:10px; padding:0 16px;}
  .map-legend{display:flex; flex-wrap:wrap; gap:6px 10px; flex:1;}
  .map-legend-item{display:flex; align-items:center; gap:4px; font-size:9.5px; color:var(--parchment-dim);}
  .map-legend-item i{width:7px; height:7px; border-radius:50%; display:block; flex-shrink:0;}
  .map-controls{display:flex; gap:6px; flex-shrink:0;}
  .map-btn{width:32px; height:32px; border-radius:8px; background:var(--ink-2); border:1px solid var(--hairline); color:var(--parchment); font-size:16px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .map-btn-wide{width:auto; padding:0 10px; font-size:10px; font-family:'Fira Code',monospace; font-weight:600; white-space:nowrap;}
  .map-wrap{position:relative; height:68vh; min-height:380px; border:none; border-top:1px solid var(--hairline); border-radius:0; overflow:hidden; background:#0c1318; touch-action:none;}
  .map-wrap svg{width:100%; height:100%; display:block; cursor:grab;}
  .map-wrap svg:active{cursor:grabbing;}
  .map-hint{position:absolute; bottom:8px; left:0; right:0; text-align:center; font-family:'Fira Code',monospace; font-size:9.5px; color:var(--parchment-dim); opacity:0.7; pointer-events:none; transition:opacity 0.3s ease;}
  .map-pin-label{font-family:'Figtree',sans-serif; font-weight:700; fill:var(--parchment); paint-order:stroke; stroke:#0c1318; stroke-width:2px; stroke-linejoin:round; pointer-events:none;}
  .map-seq-label{font-family:'Fira Code',monospace; fill:var(--parchment-dim); pointer-events:none;}

  /* ---- Today Card ---- */
  .section-label{font-family:'Fira Code',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.16em; color:var(--jade); margin:28px 0 0; padding:0 16px 14px; border-bottom:1px solid var(--hairline);}
  .today-simple{text-align:center; padding:8px 0 4px;}
  .today-simple-label{font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--parchment-dim); margin-bottom:14px;}
  .today-simple-context{font-size:14px; color:var(--parchment-dim); margin-top:12px; line-height:1.6;}

  /* ---- Diary ---- */
  .diary-header{margin-bottom:20px; padding:0 16px;}
  .diary-title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .diary-heading{font-size:26px; font-weight:800; margin-bottom:4px; letter-spacing:-0.02em;}
  .diary-subheading{font-size:13px; color:var(--parchment-dim);}
  .diary-add-btn{flex-shrink:0; background:rgba(107,142,99,0.2); color:var(--moss); border:1px solid rgba(107,142,99,0.45); border-radius:10px; padding:11px 16px; font-family:'Figtree',sans-serif; font-weight:700; font-size:14px; cursor:pointer; white-space:nowrap;}
  .diary-empty{text-align:center; padding:48px 24px; color:var(--parchment-dim);}
  .diary-empty-icon{font-size:40px; margin-bottom:14px;}
  .diary-empty-title{font-size:17px; font-weight:700; color:var(--parchment); margin-bottom:8px;}
  .diary-empty-sub{font-size:15px; line-height:1.7;}
  .diary-month-group{margin-bottom:24px;}
  .diary-month-label{font-family:'Fira Code',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber); margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--hairline);}
  .diary-entry{background:var(--ink-2); border:none; border-bottom:1px solid var(--hairline); border-radius:0; padding:16px 16px; margin-bottom:0; position:relative; overflow:hidden; cursor:pointer;}
  .diary-entry::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--entry-accent, var(--hairline));}
  .diary-entry-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:10px;}
  .diary-entry-date{font-family:'Fira Code',monospace; font-size:12px; color:var(--parchment-dim);}
  .diary-entry-loc{font-family:'Fira Code',monospace; font-size:11px; padding:2px 8px; border-radius:20px; background:var(--entry-accent-soft); color:var(--entry-accent, var(--parchment-dim)); border:1px solid var(--entry-accent-border, var(--hairline));}
  .diary-entry-mood{font-size:16px; flex-shrink:0;}
  .diary-entry-title{font-size:16px; font-weight:700; margin-bottom:6px; line-height:1.3;}
  .diary-entry-body{font-size:14px; color:var(--parchment-dim); line-height:1.7; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .diary-mode-toggle{display:flex; gap:8px; padding:0 16px; margin-bottom:16px;}
  .toggle-btn{flex:1; padding:10px 12px; font-size:13px; font-weight:600; border:1px solid var(--hairline); border-radius:6px; background:transparent; color:var(--parchment-dim); cursor:pointer; transition:all 0.15s;}
  .toggle-btn.active{background:var(--moss); color:var(--ink); border-color:var(--moss);}
  .star-picker{display:flex; gap:8px; margin:12px 0;}
  .star-btn{background:none; border:none; font-size:28px; cursor:pointer; opacity:0.3; transition:opacity 0.1s; padding:0;}
  .star-btn:hover{opacity:0.6;}
  .star-btn.active{opacity:1;}
  .review-categories{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0;}
  .cat-tag{padding:6px 12px; font-size:12px; border:1px solid var(--hairline); border-radius:20px; background:transparent; color:var(--parchment-dim); cursor:pointer; transition:all 0.15s; font-weight:600;}
  .cat-tag.selected{background:var(--amber); color:var(--ink); border-color:var(--amber);}
  .city-review-badge{font-size:12px; padding:4px 10px; border-radius:12px; background:rgba(212,168,71,0.15); color:var(--amber); border:1px solid rgba(212,168,71,0.3); font-weight:600; margin-top:8px;}
  .diary-entry.expanded .diary-entry-body{-webkit-line-clamp:unset; overflow:visible;}
  .diary-modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.65); display:none; align-items:flex-end; z-index:300;}
  .diary-modal-overlay.open{display:flex;}
  .diary-modal-sheet{width:100%; background:var(--ink-2); border-radius:18px 18px 0 0; padding:20px; max-height:90vh; overflow-y:auto;}
  .diary-modal-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .diary-modal-title{font-size:20px; font-weight:800; letter-spacing:-0.01em;}
  .diary-modal-close{background:none; border:none; color:var(--parchment-dim); font-size:24px; cursor:pointer; line-height:1;}
  .diary-field{margin-bottom:13px;}
  .diary-field label{display:block; font-size:12px; color:var(--parchment-dim); margin-bottom:7px; font-family:'Fira Code',monospace; text-transform:uppercase; letter-spacing:0.06em;}
  .diary-field input, .diary-field select, .diary-field textarea{width:100%; background:var(--ink-3); border:1px solid var(--hairline); border-radius:9px; padding:13px 14px; color:var(--parchment); font-size:15px; font-family:'Figtree',sans-serif; resize:none;}
  .diary-field textarea{min-height:160px; line-height:1.6;}
  .diary-mood-row{display:flex; gap:8px; flex-wrap:wrap;}
  .diary-mood-btn{font-size:22px; padding:6px 10px; border-radius:8px; background:var(--ink-3); border:2px solid transparent; cursor:pointer;}
  .diary-mood-btn.selected{border-color:var(--amber);}
  .diary-save-btn{width:100%; background:var(--amber); color:var(--ink); border:none; border-radius:10px; padding:15px; font-weight:700; font-size:16px; margin-top:8px; cursor:pointer; font-family:'Figtree',sans-serif;}
  .diary-photo-picker{display:flex; align-items:center; gap:10px; border:1.5px dashed var(--hairline); border-radius:10px; padding:12px 14px; cursor:pointer; margin-bottom:10px;}
  .diary-photo-picker:active{background:rgba(255,255,255,0.04);}
  .diary-photo-previews{display:flex; gap:8px; flex-wrap:wrap;}
  .diary-photo-thumb{position:relative; width:72px; height:72px; border-radius:8px; overflow:hidden; border:1px solid var(--hairline); flex-shrink:0;}
  .diary-photo-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .diary-photo-thumb .remove-photo{position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%; background:rgba(0,0,0,0.7); color:#fff; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer; line-height:1; border:none;}
  .diary-photo-uploading{opacity:0.5;}
  .diary-card-photos{display:flex; gap:6px; overflow-x:auto; margin-top:10px; padding-bottom:2px; -webkit-overflow-scrolling:touch;}
  .diary-card-photos::-webkit-scrollbar{display:none;}
  .diary-card-photo{width:90px; height:90px; border-radius:8px; object-fit:cover; flex-shrink:0; cursor:pointer; border:1px solid var(--hairline);}
  .diary-photo-lightbox{position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:400; display:flex; align-items:center; justify-content:center;}
  .diary-photo-lightbox img{max-width:96vw; max-height:90vh; border-radius:8px; object-fit:contain;}
  .diary-photo-lightbox-close{position:absolute; top:16px; right:16px; background:rgba(255,255,255,0.15); border:none; color:#fff; font-size:22px; width:38px; height:38px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center;}

  /* ---- Calendar ---- */
  .cal-legend{display:flex; flex-wrap:wrap; gap:9px 14px; margin-bottom:18px; padding:14px 16px; border-bottom:1px solid var(--hairline);}

  .cal-legend-item{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--parchment-dim);}
  .cal-legend-item i{width:8px; height:8px; border-radius:50%; display:block; flex-shrink:0;}
  .cal-month{margin-bottom:22px;}
  .cal-month-title{font-family:'Fira Code',monospace; font-size:14px; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber); margin-bottom:12px;}
  .cal-dow{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:5px;}
  .cal-dow div{text-align:center; font-size:11px; color:var(--parchment-dim); font-family:'Fira Code',monospace;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-day{aspect-ratio:1; border-radius:8px; border:1px solid var(--hairline); display:flex; align-items:center; justify-content:center; position:relative; font-size:13px; color:var(--parchment-dim); background:var(--ink-3);}
  .cal-day.has-leg{color:var(--parchment); cursor:pointer; font-weight:700; border-color:transparent;}
  .cal-day.has-leg:active{filter:brightness(1.25);}
  .cal-day.empty{background:transparent; border:none;}
  .cal-day.today{box-shadow:0 0 0 2px var(--parchment) inset;}
  .cal-plane{position:absolute; bottom:1px; right:2px; font-size:7.5px;}

  /* COSTS TAB */
  .cost-hero{background:var(--ink-2); border:none; border-bottom:3px solid var(--jade); border-radius:0; padding:16px; margin-bottom:2px; text-align:center;}
  .cost-hero .amt{font-family:'Fira Code',monospace; font-size:32px; font-weight:600; color:var(--amber);}
  .cost-hero .lbl{font-size:13px; color:var(--parchment-dim); text-transform:uppercase; letter-spacing:0.1em; margin-top:6px;}
  .cost-split{display:flex; gap:2px; margin-bottom:2px; background:var(--hairline);}
  .cs-box{flex:1; background:var(--ink-2); border:none; border-bottom:1px solid var(--hairline); border-radius:0; padding:10px 6px; text-align:center;}
  .cs-amt{font-family:'Fira Code',monospace; font-size:16px; font-weight:600;}
  .cs-lbl{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--parchment-dim); margin-top:4px;}
  .section-title{font-size:11.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--amber); margin:18px 0 10px; font-family:'Fira Code',monospace; padding:0 16px;}
  .bar-row{margin-bottom:0; cursor:pointer; padding:8px 16px; border-radius:0; border-bottom:1px solid var(--hairline);}
  .bar-row:active{background:rgba(227,163,59,0.10);}
  .bar-top{display:flex; justify-content:space-between; font-size:15px; margin-bottom:6px; color:var(--parchment);}
  .bar-track{height:6px; background:var(--ink-3); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--amber); border-radius:4px;}
  .country-cost-row{display:flex; align-items:center; justify-content:space-between; padding:11px 8px; border-bottom:1px solid var(--hairline); border-radius:8px; cursor:pointer;}
  .country-cost-row:active{background:rgba(227,163,59,0.10);}
  .country-cost-row:last-child{border-bottom:none;}
  .ccr-left{display:flex; align-items:center; gap:10px;}
  .ccr-flag{font-size:20.5px;}
  .ccr-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .ccr-name{font-size:16px; font-weight:600; color:var(--parchment);}
  .ccr-amt{font-family:'Fira Code',monospace; font-size:16px; color:var(--amber);}
  #costDetailPane{display:none; background:var(--ink-2); border:1px solid var(--amber); border-radius:var(--radius); padding:14px; margin-top:10px;}
  .cdp-title{font-size:17px; font-weight:700; margin-bottom:12px; color:var(--amber);}
  .cdp-item{background:var(--ink-3); border:1px solid var(--hairline); border-radius:10px; padding:13px 14px; margin-bottom:9px; font-size:14.5px;}
  .cdpi-row{display:flex; justify-content:space-between; gap:8px;}
  .cdpi-label{flex:1; color:var(--parchment);}
  .cdpi-cost{font-family:'Fira Code',monospace; color:var(--amber); white-space:nowrap;}
  .cdpi-sub{color:var(--parchment-dim); margin-top:5px; font-size:13.5px; line-height:1.5;}

  /* OTHER / PREP TABS (shared accordion) */
  .misc{border:1px solid var(--hairline); border-radius:var(--radius); background:var(--ink-2); overflow:hidden; margin-bottom:10px;}
  .misc-head{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;}
  .misc-icon{font-size:22px;}
  .misc-name{font-size:16px; font-weight:700; flex:1; color:var(--parchment);}
  .misc-body{display:none; padding:0 14px 14px; border-top:1px solid var(--hairline);}
  .misc.open .misc-body{display:block;}
  .misc.open .chev{transform:rotate(90deg);}
  .misc-item{padding:13px 0; border-bottom:1px solid var(--hairline); font-size:15px; line-height:1.65; color:var(--parchment);}
  .misc-item:last-child{border-bottom:none;}
  .misc-item .mi-label{font-family:'Fira Code',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber); margin-bottom:5px;}

  /* CHECKLIST + PACKING */
  .chk-row{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline);}
  .chk-row:last-child{border-bottom:none;}
  .chk-box{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--parchment-dim); flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--ink);}
  .chk-box.checked{background:var(--moss); border-color:var(--moss); color:var(--ink);}
  .chk-text{font-size:15.5px; line-height:1.55; flex:1; color:var(--parchment);}
  .chk-text.checked{color:var(--parchment-dim); text-decoration:line-through;}
  .chk-del{color:var(--rust); font-size:18.5px; cursor:pointer; padding:0 4px; flex-shrink:0;}
  .pack-cat-title{font-family:'Fira Code',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber); margin:20px 0 8px;}
  .add-row{display:flex; gap:7px; margin-top:14px;}
  .add-row input, .add-row select{background:var(--ink-3); border:1px solid var(--hairline); color:var(--parchment); border-radius:8px; padding:9px 10px; font-family:'Figtree',sans-serif; font-size:15px;}
  .add-row input{flex:1; min-width:0;}
  .add-row input::placeholder{color:var(--parchment-dim);}
  .add-row button{background:var(--amber); color:var(--ink); border:none; border-radius:8px; padding:9px 14px; font-weight:700; font-size:15px; cursor:pointer; flex-shrink:0;}

  /* PREP ADD FAB + MODAL */
  .cost-fab{position:fixed; bottom:calc(64px + env(safe-area-inset-bottom) + 14px); right:18px; width:52px; height:52px; border-radius:16px; background:var(--amber); color:var(--ink); font-size:28px; font-weight:600; border:none; cursor:pointer; z-index:90; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(212,168,71,0.35), 0 0 20px rgba(212,168,71,0.2); line-height:1; transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.15s ease;}
  .cost-fab:active{transform:scale(0.92);}
  .cost-fab:active{box-shadow:0 4px 12px rgba(212,168,71,0.4), 0 0 16px rgba(212,168,71,0.25);}
  .prep-fab{display:flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:10px; background:rgba(107,142,99,0.22); color:var(--moss); font-size:23px; font-weight:600; border:1px solid rgba(107,142,99,0.45); cursor:pointer; margin:0 auto 18px;}
  .prep-fab:active{background:rgba(107,142,99,0.32);}
  #addModalOverlay{position:fixed; inset:0; background:rgba(10,15,19,0.6); display:none; align-items:flex-end; z-index:60;}
  #addModal{background:var(--ink-2); width:100%; max-width:520px; margin:0 auto; border-radius:18px 18px 0 0; padding:20px 18px 28px; border-top:1px solid var(--hairline); position:relative;}
  #addModal .handle{width:36px; height:4px; background:var(--hairline); border-radius:4px; margin:0 auto 14px;}
  #addModal .close{position:absolute; top:14px; right:16px; background:none; border:none; color:var(--parchment-dim); font-size:20.5px; cursor:pointer;}
  .add-type-tabs{display:flex; gap:6px; margin-bottom:16px;}
  .add-type-tab{flex:1; background:var(--ink-3); border:1px solid var(--hairline); color:var(--parchment-dim); font-family:'Figtree',sans-serif; font-weight:600; font-size:14.5px; padding:10px 0; border-radius:10px; cursor:pointer; text-align:center;}
  .add-type-tab.active{background:rgba(227,163,59,0.14); border-color:var(--amber); color:var(--amber);}
  .add-field{margin-bottom:12px;}
  .add-field label{display:block; font-family:'Fira Code',monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber); margin-bottom:7px;}
  .add-field input, .add-field select{width:100%; background:var(--ink-3); border:1px solid var(--hairline); color:var(--parchment); border-radius:8px; padding:11px 12px; font-family:'Figtree',sans-serif; font-size:16px;}
  .add-save-btn{width:100%; background:var(--amber); color:var(--ink); border:none; border-radius:10px; padding:13px 0; font-weight:700; font-size:16px; cursor:pointer; margin-top:6px;}
  .prep-progress{font-family:'Fira Code',monospace; font-size:12.5px; color:var(--parchment-dim); text-align:right; margin-bottom:8px;}
  .show-done-toggle{font-family:'Fira Code',monospace; font-size:12px; color:var(--jade); text-align:center; padding:10px 0 4px; cursor:pointer; text-transform:uppercase; letter-spacing:0.06em; opacity:0.8; transition:opacity 0.15s;}
  .show-done-toggle:active{opacity:0.5;}

  /* AUTH GATE */
  #authGate{position:fixed; inset:0; background:radial-gradient(ellipse 120% 70% at 50% 0%, #1d2a35 0%, #0c1318 55%, #060a0d 100%); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; z-index:100; text-align:center; overflow:hidden;}

  /* ── Loading overlay ── */
  #loadingOverlay{position:fixed;inset:0;background:#060a0d;z-index:99;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;overflow:hidden;}
  #loadingOverlay.on{display:flex;}
  .lo-label{font-family:'Fraunces',serif;font-size:15px;color:rgba(200,180,140,.6);letter-spacing:.08em;text-transform:uppercase;z-index:1;}
  .lo-dots{display:flex;gap:6px;z-index:1;}
  .lo-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);animation:lodot 1.2s ease-in-out infinite;}
  .lo-dot:nth-child(2){animation-delay:.2s;}
  .lo-dot:nth-child(3){animation-delay:.4s;}
  @keyframes lodot{0%,80%,100%{opacity:.2;transform:scale(.8);}40%{opacity:1;transform:scale(1.2);}}
  .fall-emoji{position:absolute;top:-60px;font-size:28px;animation:fall linear infinite;will-change:transform,opacity;user-select:none;pointer-events:none;}
  @keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:0;}8%{opacity:1;}85%{opacity:.9;}100%{transform:translateY(110vh) rotate(360deg);opacity:0;}}
  .bat-spot{position:absolute; top:-180px; left:50%; transform:translateX(-50%); width:560px; height:560px; border-radius:50%; background:radial-gradient(circle, rgba(227,163,59,0.22) 0%, rgba(227,163,59,0.06) 45%, transparent 70%); pointer-events:none;}
  .bat-mark{width:96px; height:96px; margin:0 auto 18px; position:relative; z-index:1; opacity:0.95;}
  .bat-eyebrow{font-family:'Fira Code',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.18em; color:var(--amber); margin-bottom:10px; position:relative; z-index:1;}
  #authGate h2{font-size:25px; margin:0 0 8px; position:relative; z-index:1; letter-spacing:0.01em;}
  #authGate p{font-size:15px; color:var(--parchment-dim); margin:0 0 26px; max-width:300px; line-height:1.55; position:relative; z-index:1;}
  .gh-login-btn{display:flex; align-items:center; gap:10px; background:var(--parchment); color:var(--ink); border:none; border-radius:10px; padding:14px 24px; font-family:'Figtree',sans-serif; font-weight:700; font-size:16px; cursor:pointer; position:relative; z-index:1; box-shadow:0 0 0 1px rgba(227,163,59,0.3);}
  .bat-footer{font-family:'Fira Code',monospace; font-size:10px; color:var(--parchment-dim); opacity:0.6; margin-top:22px; position:relative; z-index:1; letter-spacing:0.04em;}
  .auth-spinner{width:24px; height:24px; border:3px solid var(--hairline); border-top-color:var(--amber); border-radius:50%; animation:spin 0.8s linear infinite; position:relative; z-index:1;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="authGate">
  <div class="bat-spot"></div>
  <svg class="bat-mark" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
    <path fill="#E3A33B" d="M50 14c-2.5-4-6-7-6-7s1 4-1 7c-3-5-9-9-15-10 2 3 4 7 4 10-7-2-15-1-20 3 5 0 11 2 14 5-6 0-13 3-17 8 6-2 13-2 18 0-5 3-9 8-10 13 5-4 11-7 16-7-2 4-2 9 0 13 1-5 4-9 8-11 1 5 4 9 9 11-2-4-2-9 0-13 5 0 11 3 16 7-1-5-5-10-10-13 5-2 12-2 18 0-4-5-11-8-17-8 3-3 9-5 14-5-5-4-13-5-20-3 0-3 2-7 4-10-6 1-12 5-15 10-2-3-1-7-1-7s-3.5 3-6 7z"/>
  </svg>
  <div class="auth-gate-title">🦇 Dark Knight Travels</div>
  <div id="authGateContent">
    <div class="auth-spinner" id="authSpinner"></div>
  </div>
</div>

<div id="loadingOverlay">
  <div class="lo-label">Loading your adventure</div>
  <div class="lo-dots"><div class="lo-dot"></div><div class="lo-dot"></div><div class="lo-dot"></div></div>
</div>

<div id="pullRefreshBar" style="position:fixed;top:0;left:0;right:0;height:3px;background:var(--amber);transform:scaleX(0);transform-origin:left;transition:transform 0.1s;z-index:999;pointer-events:none;"></div>

<script>
const COUNTRY_META = {
  USA:{flag:"🇺🇸",name:"United States",accent:"#E0A93B"},
  Mexico:{flag:"🇲🇽",name:"Mexico",accent:"#D9714B"},
  Guatemala:{flag:"🇬🇹",name:"Guatemala",accent:"#5FA876"},
  Peru:{flag:"🇵🇪",name:"Peru",accent:"#C1463F"},
  Bolivia:{flag:"🇧🇴",name:"Bolivia",accent:"#3FB8B0"},
  Argentina:{flag:"🇦🇷",name:"Argentina",accent:"#5C9BD9"},
  Brazil:{flag:"🇧🇷",name:"Brazil",accent:"#7FBF4D"},
};

const PRIO_RANK = {"\ud83d\udea8 High":1,"\ud83d\udfe1 Medium":2,"\ud83d\udfe2 Low":3,"\ud83d\udfe2 watch":3.5,null:4};
let DATA = [];
let GENERAL_COSTS = [];

async function loadData(){
  try{
    const legs = await sb('trip_legs?select=*&order=sort_order.asc');
    const bookingsRaw = await sb('trip_bookings?select=*');
    const flightDetailsRaw = await sb('trip_flight_details?select=*');
    const fdByBooking = {};
    flightDetailsRaw.forEach(function(fd){ fdByBooking[fd.booking_id] = fd; });

    const byLeg = {};
    const general = [];
    bookingsRaw.forEach(function(b){
      const item = {id:b.id, cat:b.cat, title:b.title, provider:b.provider, cost:b.cost, status:b.status, note:b.note, fd: fdByBooking[b.id] || null};
      if(b.leg_id === null){
        general.push(item);
      }else{
        if(!byLeg[b.leg_id]) byLeg[b.leg_id] = [];
        byLeg[b.leg_id].push(item);
      }
    });
    DATA = legs.map(function(l){
      return {
        id: l.id,
        country: l.country,
        loc: l.loc,
        start: l.start_label,
        end: l.end_label,
        dates: l.dates_display,
        start_date: l.start_date,
        end_date: l.end_date,
        lat: l.lat,
        lng: l.lng,
        status: l.status,
        priority: l.priority,
        plan: l.plan,
        booking: l.booking_needed,
        notes: l.notes,
        bookings: byLeg[l.id] || []
      };
    });
    GENERAL_COSTS = general;
  }catch(e){
    showSaveStatus('error loading trip data: ' + (e && e.message ? e.message : String(e)));
    DATA = [];
    GENERAL_COSTS = [];
  }
}

function statusPill(s){
  if(s==='booked' || s==='partial') return '<span class="pill booked">booked</span>';
  return '<span class="pill open">not booked</span>';
}
function dotColor(s){ return (s==='booked' || s==='partial') ? 'var(--moss)' : 'var(--rust)'; }

function computeCritical(){
  const open = DATA.filter(d=>d.status==='open');
  open.sort((a,b)=>{
    const pa = PRIO_RANK[a.priority] ?? 4, pb = PRIO_RANK[b.priority] ?? 4;
    if(pa!==pb) return pa-pb;
    return a.id - b.id;
  });
  return open[0] || null;
}

function legDays(d){
  if(!d.start_date || !d.end_date) return '';
  const diff = Math.round((new Date(d.end_date+'T00:00:00') - new Date(d.start_date+'T00:00:00')) / 86400000);
  return diff > 0 ? diff+'d' : '1d';
}
function countryTotalDays(legs){
  const first = legs.find(function(l){ return l.start_date; });
  const last = [...legs].reverse().find(function(l){ return l.end_date; });
  if(!first || !last) return '';
  const diff = Math.round((new Date(last.end_date+'T00:00:00') - new Date(first.start_date+'T00:00:00')) / 86400000);
  return diff > 0 ? diff+'d' : '';
}

function groupByCountry(){
  const groups = [];
  const order = [];
  DATA.forEach(function(d){ if(order.indexOf(d.country)===-1) order.push(d.country); });
  order.forEach(function(cn){
    const legs = DATA.filter(function(d){ return d.country===cn; });
    groups.push({ country: cn, start: legs[0].start, end: legs[legs.length-1].end, legs: legs });
  });
  return groups;
}

const COUNTRY_IMG = {
  USA:       "https://images.unsplash.com/photo-1549813069-a5f8c1dce35f?w=700&h=200&fit=crop&crop=center&q=80", // Statue of Liberty aerial with Manhattan skyline by Alex Haney
  Mexico:    "https://images.unsplash.com/photo-1672687468661-f77325658ae5?w=700&h=200&fit=crop&crop=center&q=80", // Teotihuacan aerial by Anton Lukin
  Guatemala: "https://images.unsplash.com/photo-1555339990-18e05015e062?w=700&h=200&fit=crop&crop=center&q=80", // Fuego lava eruption at night by Aaron Thomas
  Peru:      "https://images.unsplash.com/photo-1725197892394-0c0c598ecb98?w=700&h=200&fit=crop&crop=center&q=80", // Machu Picchu by Meg von Haartman
  Bolivia:   "https://images.unsplash.com/photo-1528161498624-89b0174b714d?w=700&h=200&fit=crop&crop=center&q=80", // Uyuni mirror sky by B
  Argentina: "https://images.unsplash.com/photo-1656856747603-1777348793e6?w=700&h=200&fit=crop&crop=center&q=80", // Iguazú Falls panoramic by Nadine Marfurt
  Brazil:    "https://images.unsplash.com/photo-1537798518344-7ee3acb6e6d1?w=700&h=200&fit=crop&crop=center&q=80", // Rio de Janeiro sunset by Peter Conlan
};


function getReviewBadgeForLeg(legId){
  if(!DIARY_ENTRIES) return '';
  const reviews = DIARY_ENTRIES.filter(e => e.leg_id === legId && e.type === 'review' && e.rating);
  if(reviews.length === 0) return '';
  const avgRating = reviews.reduce((sum, e) => sum + e.rating, 0) / reviews.length;
  const stars = Array(Math.round(avgRating)).fill('⭐').join('');
  return '<div class="city-review-badge">'+stars+' · '+reviews.length+' review'+(reviews.length>1?'s':'')+'</div>';
}

function renderCountries(){
  const groups = groupByCountry();
  const el = document.getElementById('countries');
  el.innerHTML = groups.map(function(g,i){
    const meta = COUNTRY_META[g.country] || {flag:'🏳️', name:g.country, accent:'#B9B2A0'};
    const bars = g.legs.map(function(l){ return '<i style="background:'+dotColor(l.status)+'"></i>'; }).join('');
    const imgSrc = COUNTRY_IMG[g.country];
    const imgHtml = imgSrc ? '<img class="country-img" src="'+imgSrc+'" alt="'+meta.name+'" loading="lazy">' : '';
    const legsHtml = g.legs.map(function(l){
      const bkCount = (l.bookings && l.bookings.length) ? l.bookings.length : 0;
      // Extract first meaningful activity line from plan
      const planLines = l.plan ? l.plan.split('\n').filter(function(ln){
        return ln.trim() && !ln.match(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)/) && ln.length > 10;
      }) : [];
      const preview = planLines[0] ? planLines[0].slice(0,80) + (planLines[0].length > 80 ? '…' : '') : '';
      return '<div class="leg" onclick="event.stopPropagation(); openSheet('+l.id+')">'
        + '<div class="leg-card" style="--barcolor:'+meta.accent+'">'
        + '<div class="leg-top"><div><div class="leg-loc">'+l.loc+'</div>'
        + '<div class="leg-dates">'+l.dates+(legDays(l) ? ' · '+legDays(l) : '')+'</div></div>'+statusPill(l.status)+'</div>'
        + (bkCount ? '<div class="leg-bk-row"><div class="leg-bk-dot"></div><div class="leg-bk-label">'+bkCount+' booking'+(bkCount>1?'s':'')+' confirmed</div></div>' : '')
        + getReviewBadgeForLeg(l.id)
        + '</div></div>';
    }).join('');
    return '<div class="country" id="country-'+i+'" style="--accent:'+meta.accent+'; --accent-soft:'+meta.accent+'26; animation-delay:'+(i*0.08)+'s;">'
      + '<div class="country-head" onclick="toggleCountry('+i+')">'
      + '<div class="country-strip">'
      + '<div class="country-strip-flag">'+meta.flag+'</div>'
      + '<div class="country-strip-info">'
      + '<div class="country-strip-name">'+meta.name+'</div>'
      + (countryTotalDays(g.legs) ? '<div class="country-strip-days">'+countryTotalDays(g.legs)+'</div>' : '')
      + '</div>'
      + '<div class="country-strip-dates">'+g.start+'<br>'+g.end+'</div>'
      + '</div>'
      + imgHtml
      + '</div><div class="country-body">'+legsHtml+'</div></div>';
  }).join('');
}

function renderCalendar(){
  const el = document.getElementById('tab-calendar');
  if(!el) return;
  const months = [
    {y:2026, m:6, label:'July 2026'},
    {y:2026, m:7, label:'August 2026'},
    {y:2026, m:8, label:'September 2026'},
    {y:2026, m:9, label:'October 2026 (partial)'}
  ];
  const todayStr = new Date().toISOString().slice(0,10);

  const dateMap = {};
  const dateCount = {};
  DATA.forEach(function(d){
    if(!d.start_date) return;
    const endStr = d.end_date || d.start_date;
    let cur = new Date(d.start_date+'T00:00:00');
    const endD = new Date(endStr+'T00:00:00');
    while(cur <= endD){
      const key = cur.toISOString().slice(0,10);
      dateCount[key] = (dateCount[key]||0) + 1;
      dateMap[key] = {country:d.country, legId:d.id, loc:d.loc};
      cur = new Date(cur.getTime() + 86400000);
    }
  });

  const legend = Object.keys(COUNTRY_META).map(function(c){
    const meta = COUNTRY_META[c];
    return '<div class="cal-legend-item"><i style="background:'+meta.accent+';"></i>'+meta.flag+' '+c+'</div>';
  }).join('') + '<div class="cal-legend-item">✈️ travel day</div>';

  const monthsHtml = months.map(function(mo){
    const firstDow = new Date(mo.y, mo.m, 1).getDay();
    const daysInMonth = new Date(mo.y, mo.m+1, 0).getDate();
    let cells = '';
    for(let i=0;i<firstDow;i++){ cells += '<div class="cal-day empty"></div>'; }
    for(let day=1; day<=daysInMonth; day++){
      const dateObj = new Date(mo.y, mo.m, day);
      const key = dateObj.toISOString().slice(0,10);
      const info = dateMap[key];
      const meta = info ? (COUNTRY_META[info.country] || {accent:'#777'}) : null;
      const isToday = key === todayStr;
      const isTransit = info && dateCount[key] > 1;
      const style = meta ? ('background:'+meta.accent+'2E; border-color:'+meta.accent+';') : '';
      const onclick = info ? (' onclick="openSheet('+info.legId+')"') : '';
      cells += '<div class="cal-day'+(isToday?' today':'')+(info?' has-leg':'')+'" style="'+style+'"'+onclick+'>'
        + day + (isTransit ? '<span class="cal-plane">✈️</span>' : '')
        + '</div>';
    }
    return '<div class="cal-month"><div class="cal-month-title">'+mo.label+'</div>'
      + '<div class="cal-dow">'+['S','M','T','W','T','F','S'].map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>'
      + '<div class="cal-grid">'+cells+'</div></div>';
  }).join('');

  el.innerHTML = '<div class="cal-legend">'+legend+'</div>' + monthsHtml;
}

function switchDiaryMode(mode){
  diaryMode = mode;

  const reviewBtn = document.getElementById('modeReviewBtn');
  const reviewFields = document.getElementById('diaryReviewFields');
  if(mode === 'entry'){
    entryBtn.classList.add('active');

    reviewFields.style.display = 'none';
  } else {
    entryBtn.classList.remove('active');
    reviewBtn.classList.add('active');

      buildStarPicker();

function buildStarPicker(){
  const picker = document.getElementById('starPicker');
  for(let i=1; i<=5; i++){
    const btn = document.createElement('button');
    btn.className = 'star-btn';
    btn.textContent = '⭐';
    btn.dataset.rating = i;
    btn.onclick = function(){ selectRating(i); };
    picker.appendChild(btn);
  }
}
function selectRating(rating){
  selectedRating = rating;
  const btns = document.querySelectorAll('#starPicker .star-btn');
  btns.forEach((btn, i) => btn.classList.toggle('active', i < rating));
}
function buildCategories(){
  const container = document.getElementById('reviewCategories');
  const cats = ['#accommodation', '#food', '#activity', '#vibe', '#transport'];
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-tag';
    btn.textContent = cat;
    btn.onclick = function(){
      btn.classList.toggle('selected');
      if(btn.classList.contains('selected') && !selectedCategories.includes(cat)){
        selectedCategories.push(cat);
      } else if(!btn.classList.contains('selected')){
        selectedCategories = selectedCategories.filter(c => c !== cat);
      }
    };
    container.appendChild(btn);
  });

async function uploadDiaryPhoto(file, entryId){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = entryId + '/' + Date.now() + '-' + Math.random().toString(36).slice(2) + '.' + ext;
  const { data, error } = await authClient.storage.from('diary-photos').upload(path, file, {contentType: file.type, upsert: false});
  if(error) throw new Error('Upload failed: ' + error.message);
  return data.path;
}

async function saveDiaryEntry(){
  const dateStr = document.getElementById('diaryDateInput').value;
  const title = document.getElementById('diaryTitleInput').value.trim();
  const body = document.getElementById('diaryBodyInput').value.trim();
  if(!dateStr || !body){ alert('Date and entry text are required.'); return; }
  const saveBtn = document.querySelector('.diary-save-btn');
  saveBtn.textContent = 'Saving…'; saveBtn.disabled = true;
  const leg = getLegForDate(dateStr);
  try{
    const inserted = await sb('trip_diary_entries', {
      method:'POST', headers:{'Prefer':'return=representation'},
      body: JSON.stringify({entry_date:dateStr, leg_id:leg?leg.id:null, title:title||null, body:body, mood:selectedMood||null, type:diaryMode, rating:diaryMode==='review'?selectedRating:null, categories:diaryMode==='review'?selectedCategories:[], photos:[]})
    });
    const entry = inserted[0];
    const valid = pendingDiaryPhotos.filter(Boolean);
    const photos = [];
    for(let i=0; i<valid.length; i++){
      saveBtn.textContent = 'Uploading photo '+(i+1)+'/'+valid.length+'…';
      photos.push(await uploadDiaryPhoto(valid[i].file, entry.id));
    }
    if(photos.length){
      await sb('trip_diary_entries?id=eq.'+entry.id, {method:'PATCH', headers:{'Prefer':'return=representation'}, body:JSON.stringify({photos:photos})});
      entry.photos = photos;
    }
    DIARY_ENTRIES.unshift(entry);
    renderDiary();
    closeDiaryModal();
  }catch(e){
    showSaveStatus('error: '+e.message);
  }finally{
    saveBtn.textContent = 'Save Entry'; saveBtn.disabled = false;
  }
}

const COUNTRY_ISO = {"840":"USA","484":"Mexico","320":"Guatemala","604":"Peru","068":"Bolivia","032":"Argentina","076":"Brazil","076":"Brazil"};
let MAP_ZOOM = null, MAP_SVG = null, MAP_G = null, MAP_K0 = 1.8;

async function renderMap(){
  if(typeof d3 === 'undefined' || typeof topojson === 'undefined'){
    setTimeout(renderMap, 150);
    return;
  }
  const wrap = document.getElementById('mapWrap');
  const width = wrap.clientWidth || 360;
  const height = wrap.clientHeight || 480;

  document.getElementById('mapLegend').innerHTML = Object.keys(COUNTRY_META).map(function(c){
    const meta = COUNTRY_META[c];
    return '<div class="map-legend-item"><i style="background:'+meta.accent+';"></i>'+meta.flag+' '+c+'</div>';
  }).join('');

  let world;
  try{
    const resp = await fetch('map-countries-110m.json');
    world = await resp.json();
  }catch(e){
    document.getElementById('mapWrap').innerHTML = '<div style="padding:30px; text-align:center; color:var(--parchment-dim); font-size:13px;">Map data failed to load. Check your connection and reopen this tab.</div>';
    return;
  }
  const countries = topojson.feature(world, world.objects.countries);

  const projection = d3.geoNaturalEarth1().fitSize([width, height], countries);
  const path = d3.geoPath(projection);

  const svg = d3.select('#mapSvg').attr('viewBox', '0 0 '+width+' '+height);
  svg.selectAll('*').remove();
  MAP_SVG = svg;

  const g = svg.append('g').attr('class', 'zoomable');
  MAP_G = g;

  // Country fills
  g.append('g').attr('class', 'countries-layer')
    .selectAll('path')
    .data(countries.features)
    .join('path')
    .attr('d', path)
    .attr('fill', function(d){ return COUNTRY_ISO[d.id] ? (COUNTRY_META[COUNTRY_ISO[d.id]].accent + 'B3') : '#2A3744'; })
    .attr('stroke', '#0c1318')
    .attr('stroke-width', 0.6);

  // Arrowhead marker
  const defs = svg.append('defs');
  defs.append('marker').attr('id','arrowhead').attr('viewBox','0 0 10 10')
    .attr('refX', 8).attr('refY', 5).attr('markerWidth', 5).attr('markerHeight', 5).attr('orient','auto-start-reverse')
    .append('path').attr('d','M0,0 L10,5 L0,10 Z').attr('fill', '#EDE3CF');

  // Build sequential pin chain (legs with coordinates, in trip order)
  const points = DATA.filter(function(d){ return d.lat != null && d.lng != null; });
  const arrowsLayer = g.append('g').attr('class', 'arrows-layer');
  const pinsLayer = g.append('g').attr('class', 'pins-layer');
  const labelsLayer = g.append('g').attr('class', 'labels-layer');

  const projected = points.map(function(d){
    const xy = projection([d.lng, d.lat]);
    return {d:d, x:xy[0], y:xy[1]};
  });

  // Curved arrows between consecutive points
  for(let i=0; i<projected.length-1; i++){
    const a = projected[i], b = projected[i+1];
    const dx = b.x-a.x, dy = b.y-a.y;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    const offset = Math.min(dist*0.22, 40);
    const cx = mx - (dy/dist)*offset;
    const cy = my + (dx/dist)*offset;
    arrowsLayer.append('path')
      .attr('d', 'M'+a.x+','+a.y+' Q'+cx+','+cy+' '+b.x+','+b.y)
      .attr('fill','none').attr('stroke','#EDE3CF').attr('stroke-opacity', 0.55)
      .attr('stroke-width', 1.4).attr('marker-end','url(#arrowhead)')
      .attr('class','map-arrow');
    arrowsLayer.append('text')
      .attr('x', cx).attr('y', cy)
      .attr('class','map-seq-label')
      .attr('text-anchor','middle')
      .attr('font-size', 7)
      .text(i+1);
  }

  // Pins
  const meta_for = function(d){ return COUNTRY_META[d.country] || {accent:'#B9B2A0'}; };
  pinsLayer.selectAll('circle')
    .data(projected)
    .join('circle')
    .attr('cx', function(p){ return p.x; })
    .attr('cy', function(p){ return p.y; })
    .attr('r', 4)
    .attr('fill', function(p){ return meta_for(p.d).accent; })
    .attr('stroke', '#0c1318').attr('stroke-width', 1.2)
    .style('cursor','pointer')
    .on('click', function(ev, p){ openSheet(p.d.id); });

  labelsLayer.selectAll('text')
    .data(projected)
    .join('text')
    .attr('x', function(p){ return p.x+7; })
    .attr('y', function(p){ return p.y+3; })
    .attr('class','map-pin-label')
    .attr('font-size', 9)
    .text(function(p){ return p.d.loc; });

  // Initial framing: fit bounding box of all pins (the Americas-heavy trip route)
  const xs = projected.map(function(p){ return p.x; });
  const ys = projected.map(function(p){ return p.y; });
  const bx0 = Math.min.apply(null, xs), bx1 = Math.max.apply(null, xs);
  const by0 = Math.min.apply(null, ys), by1 = Math.max.apply(null, ys);
  const bw = Math.max(bx1-bx0, 1), bh = Math.max(by1-by0, 1);
  const pad = 0.22;
  let k0 = Math.min(width/(bw*(1+pad)), height/(bh*(1+pad)));
  k0 = Math.max(1, Math.min(k0, 6));
  MAP_K0 = k0;
  const tx = width/2 - k0*(bx0+bx1)/2;
  const ty = height/2 - k0*(by0+by1)/2;

  const labelTextNodes = labelsLayer.selectAll('text').nodes();

  function updateVisuals(t){
    g.attr('transform', t);
    const k = t.k;
    pinsLayer.attr('stroke-width', 1.2/k).selectAll('circle').attr('r', 4/k);
    arrowsLayer.selectAll('path.map-arrow').attr('stroke-width', 1.4/k);
    arrowsLayer.selectAll('text').attr('font-size', 7/k);
    const showPins = k > k0*0.55;
    const showLabels = k > k0*2.1;
    pinsLayer.style('opacity', showPins ? 1 : 0).style('pointer-events', showPins ? 'auto' : 'none');
    arrowsLayer.style('opacity', showPins ? 1 : 0);
    document.getElementById('mapHint').style.opacity = (showPins ? '0' : '0.7');

    if(!showLabels){
      labelsLayer.style('opacity', 0);
      return;
    }
    labelsLayer.style('opacity', 1);
    labelsLayer.selectAll('text').attr('font-size', 9/k);
    // greedy collision avoidance: hide any label whose screen-space box overlaps an already-placed one
    const placed = [];
    labelTextNodes.forEach(function(node, i){
      const p = projected[i];
      const screen = t.apply([p.x, p.y]);
      let w = 60;
      try{ w = node.getComputedTextLength() || 60; }catch(e){}
      const rect = {x0:screen[0]-2, x1:screen[0]+w+10, y0:screen[1]-9, y1:screen[1]+9};
      const collide = placed.some(function(r){
        return !(rect.x1 < r.x0 || rect.x0 > r.x1 || rect.y1 < r.y0 || rect.y0 > r.y1);
      });
      node.style.display = collide ? 'none' : '';
      if(!collide) placed.push(rect);
    });
  }

  const zoom = d3.zoom()
    .scaleExtent([0.9, 24])
    .on('zoom', function(ev){ updateVisuals(ev.transform); });

  MAP_ZOOM = zoom;
  svg.call(zoom);
  const initialT = d3.zoomIdentity.translate(tx,ty).scale(k0);
  svg.call(zoom.transform, initialT);
  updateVisuals(initialT);
}

function mapZoomBy(factor){
  if(!MAP_SVG || !MAP_ZOOM) return;
  MAP_SVG.transition().duration(220).call(MAP_ZOOM.scaleBy, factor);

function renderRail(){
  const groups = groupByCountry();
  const rail = document.getElementById('rail');
  const caption = document.getElementById('railCaption');
  if(!groups.length){ rail.innerHTML=''; caption.textContent=''; return; }

  const NOMINAL_OPEN_DAYS = 14; // for open-ended legs
  const spans = groups.map(function(g){
    const firstLeg = g.legs[0], lastLeg = g.legs[g.legs.length-1];
    const start = firstLeg.start_date ? new Date(firstLeg.start_date+'T00:00:00') : null;
    let end = lastLeg.end_date ? new Date(lastLeg.end_date+'T00:00:00') : null;
    if(!end && start) end = new Date(start.getTime() + NOMINAL_OPEN_DAYS*86400000);
    const days = (start && end) ? Math.max(1, Math.round((end-start)/86400000)) : 1;
    return {country: g.country, start: start, end: end, days: days};
  });
  const totalDays = spans.reduce(function(s,x){ return s+x.days; }, 0);
  const overallStart = spans[0].start;
  const overallEnd = spans[spans.length-1].end;

  const segHtml = spans.map(function(s, i){
    const meta = COUNTRY_META[s.country] || {accent:"#B9B2A0"};
    const pct = (s.days/totalDays*100).toFixed(2);
    return '<div class="rail-seg" style="width:'+pct+'%; background:'+meta.accent+';" onclick="jumpToCountry('+i+')"></div>';
  }).join('');

  rail.innerHTML = segHtml;
  const rail2 = document.getElementById('rail2');
  if(rail2) rail2.innerHTML = segHtml;

  const today = new Date(); today.setHours(0,0,0,0);
  if(overallStart && overallEnd && today >= overallStart && today <= overallEnd){
    const pct = ((today-overallStart)/(overallEnd-overallStart)*100).toFixed(2);
    rail.insertAdjacentHTML('beforeend', '<div class="rail-marker" style="left:'+pct+'%;"></div>');
    const here = DATA.find(function(d){ return d.start_date && d.end_date && (new Date().toISOString().slice(0,10))>=d.start_date && (new Date().toISOString().slice(0,10))<=d.end_date; });
    caption.innerHTML = here ? ('You are here: <b>'+here.loc+'</b>') : '';
  }else if(overallStart && today < overallStart){
    const daysToGo = Math.ceil((overallStart-today)/86400000);
    caption.innerHTML = '<b>'+daysToGo+' days</b> until departure';
  }else{
    caption.innerHTML = '';
  }
}

  return '•';

function parseDayBlocks(plan){
  if(!plan) return [];
  const dp = /^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/;
  const lines = plan.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
  const blocks=[]; let cur=null;
  lines.forEach(function(line){
    const m=line.match(dp);
    if(m){
      if(cur) blocks.push(cur);
      const rest=line.replace(/^(Mon|Tue|Wed|Thu|Fri|Sat|Sun)\s+\d{1,2}\s+\w+\s*[—–-]\s*/,'');
      cur={dow:m[1],day:m[2],mon:m[3],headline:rest,lines:[]};
    } else if(cur&&line){ cur.lines.push(line); }
  });
  if(cur) blocks.push(cur);
  return blocks;
}
function renderPlan(plan, leg){
  const blocks=parseDayBlocks(plan);
  if(!blocks.length){
    if(!plan||!plan.trim()) return '<div style="color:var(--parchment-dim);font-size:14px;padding:8px 0;">No plan added yet.</div>';
    return '<div style="font-size:15px;line-height:1.7;color:var(--parchment);">'+plan.replace(/\n/g,'<br>')+'</div>';
  }
  return '<div class="day-list">'+blocks.map(function(b,idx){
    return '<div class="day-list-item" onclick="openDayDetail('+idx+',currentSheetId)">'
      +'<div class="day-list-date">'+b.dow+'<br>'+b.day+' '+b.mon+'</div>'
      +'<div class="day-list-headline">'+b.headline+'</div>'

  }).join('')+'</div>';
}

const ICON_CATEGORY = {"🏨":"Accommodation","✈️":"Flights","🎟️":"Activities & Tours","🚆":"Transport","🚌":"Transport","🚐":"Transport","🚗":"Transport","📄":"Documents & Health","💊":"Documents & Health"};

function parseCost(str){
  if(!str) return 0;
  const m = String(str).match(/\$?\s*([\d,]+(?:\.\d+)?)/);
  if(!m) return 0;
  const n = parseFloat(m[1].replace(/,/g,''));
  return isNaN(n) ? 0 : n;
}

function allBookingsFlat(){
  const out = [];
  DATA.forEach(function(d){
    (d.bookings||[]).forEach(function(b){ out.push(Object.assign({}, b, {country:d.country})); });
  });
  GENERAL_COSTS.forEach(function(b){ out.push(Object.assign({}, b, {country:"General"})); });
  return out;
}

function computeCostSummary(){
  const items = allBookingsFlat();
  const sum = {paid:0, confirmed:0, reserved:0, total:0};
  const byCategory = {};
  const byCountry = {};
  items.forEach(function(b){
    const v = parseCost(b.cost);
    sum.total += v;
    if(b.status==='paid') sum.paid += v;
    else if(b.status==='confirmed') sum.confirmed += v;
    else sum.reserved += v;
    const cat = ICON_CATEGORY[b.cat] || "Other";
    byCategory[cat] = (byCategory[cat]||0) + v;
    byCountry[b.country] = (byCountry[b.country]||0) + v;
  });
  return {sum, byCategory, byCountry};
}

function fmtAud(n){ return '$' + n.toLocaleString('en-AU', {minimumFractionDigits:0, maximumFractionDigits:0}); }

let currentDetailKey = null;
function showCostDetail(type, key){
  const pane = document.getElementById('costDetailPane');
  if(currentDetailKey === type+':'+key){
    pane.style.display = 'none';
    currentDetailKey = null;
    return;
  }
  currentDetailKey = type+':'+key;
  const items = allBookingsFlat().filter(function(b){
    return type==='category' ? (ICON_CATEGORY[b.cat]||'Other')===key : b.country===key;
  });
  const title = type==='category' ? key : ((COUNTRY_META[key] && COUNTRY_META[key].name) || key);
  pane.innerHTML = '<div class="cdp-title">'+title+' · '+fmtAud(items.reduce(function(s,b){return s+parseCost(b.cost);},0))+'</div>'
    + items.map(function(b){
      return '<div class="cdp-item"><div class="cdpi-row"><div class="cdpi-label">'+b.cat+' '+b.title+'</div>'
        + '<div class="cdpi-cost">'+(b.cost||'')+'</div></div>'
        + (b.provider ? '<div class="cdpi-sub">'+b.provider+'</div>' : '')
        + '<div style="margin-top:6px;">'+bkStatusPill(b.status)+'</div></div>';

  pane.style.display = 'block';

    const target = scrollY + rect.top - 80;
    window.scrollTo({top: Math.max(0, target), behavior: 'smooth'});
  });
}

async function sb(path, options){
  options = options || {};
  let authHeader = 'Bearer ' + SUPABASE_KEY;
  try{
    const { data: { session } } = await authClient.auth.getSession();
    if(session && session.access_token) authHeader = 'Bearer ' + session.access_token;
  }catch(e){ /* fall back to anon key for unauthenticated reads */ }
  const headers = Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': authHeader,
    'Content-Type': 'application/json'
  }, options.headers || {});
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, options, {headers: headers}));
  if(!res.ok){
    const txt = await res.text().catch(function(){ return res.statusText; });
    throw new Error('Supabase ' + res.status + ': ' + txt);
  }
  if(res.status === 204) return null;
  return res.json();
}

function getCurrentLeg(){

  const todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  let match = DATA.find(function(d){ return d.start_date && d.end_date && todayStr>=d.start_date && todayStr<=d.end_date; });
  if(!match){
    // open-ended leg or before/after trip — fall back to nearest
    const openEnded = DATA.filter(function(d){ return d.start_date && !d.end_date && todayStr>=d.start_date; });
    if(openEnded.length) match = openEnded[openEnded.length-1];
  }
  if(!match && DATA.length && DATA[0].start_date && todayStr < DATA[0].start_date) match = null; // before trip starts
  return match || null;
}

(function(){
  let sx = 0, sy = 0, pulling = false;
  const bar = document.getElementById('pullRefreshBar');
  const scroller = document.getElementById('mainContent');

  document.addEventListener('touchstart', function(e){
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    const scrollTop = scroller ? scroller.scrollTop : window.scrollY;
    pulling = scrollTop === 0;
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    if(!pulling || !bar) return;
    const dy = e.touches[0].clientY - sy;
    if(dy > 0 && Math.abs(dy) > Math.abs(e.touches[0].clientX - sx)){
      const progress = Math.min(dy / 90, 1);
      bar.style.transform = 'scaleX('+progress+')';
    }
  }, {passive:true});

  document.addEventListener('touchend', function(e){
    if(!bar) return;
    const dy = e.changedTouches[0].clientY - sy;
    const dx = e.changedTouches[0].clientX - sx;
    bar.style.transform = 'scaleX(0)';

    // Pull-to-refresh: pulled down 90px+ from top, more vertical than horizontal
    if(pulling && dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.5 && (scroller ? scroller.scrollTop : window.scrollY) === 0){
      bar.style.transform = 'scaleX(1)';
      setTimeout(function(){ window.location.reload(true); }, 120);
      return;
    }

    pulling = false;

    // Horizontal swipe navigation
    if(Math.abs(dx) < 55 || Math.abs(dx) < Math.abs(dy)*1.5) return;
    const idx = SWIPE_TABS.indexOf(currentTab);
    if(dx < 0 && idx < SWIPE_TABS.length-1) navigateTo(SWIPE_TABS[idx+1]);
    else if(dx > 0 && idx > 0) navigateTo(SWIPE_TABS[idx-1]);
  }, {passive:true});
})();



const TRIP_START = new Date("2026-07-14T09:10:00+10:00");

function flipTile(id, newChar){
  const tile = document.getElementById(id);
  if(!tile) return;
  const span = tile.querySelector('span');
  const oldChar = tile.getAttribute('data-val') || '-';
  if(oldChar === newChar) return;
  tile.setAttribute('data-val', newChar);
  // Phase 1: rotate out (0 → -90deg)
  span.style.transition = 'transform 0.18s ease-in';
  span.style.transform = 'rotateX(-90deg)';
  setTimeout(function(){
    // Mid-flip: swap digit, flip to other side
    span.textContent = newChar;
    span.style.transition = 'none';
    span.style.transform = 'rotateX(90deg)';
    // Phase 2: rotate in (90deg → 0)
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        span.style.transition = 'transform 0.18s ease-out';
        span.style.transform = 'rotateX(0deg)';
      });
    });
  }, 180);
}

function tickCountdown(){
  const now = new Date();
  let diff = TRIP_START - now;
  if(diff < 0) diff = 0;
  const days  = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins  = Math.floor((diff % 3600000)  / 60000);
  const secs  = Math.floor((diff % 60000)    / 1000);
  function setTiles(prefix, val){
    const s = String(val).padStart(2,'0');
    flipTile(prefix+'0', s[0]);
    flipTile(prefix+'1', s[1]);
  }
  setTiles('cdD', days);
  setTiles('cdH', hours);
  setTiles('cdM', mins);
  setTiles('cdS', secs);
}

      + (window.navigator.standalone ? '<p style="color:var(--parchment-dim); font-size:12.5px;">Tip: if this keeps bouncing back to login from the home screen icon, GitHub\'s sign-in page may be opening in Safari instead of staying in this app — a known iOS limitation. Try logging in once from a regular Safari tab at this same URL.</p>' : '')
      + '<button class="gh-login-btn" onclick="doLogin()">'
        + '<svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>'
        + 'Enter the Batcave'
      + '</button>'
      + '<div class="bat-footer">Authorized personnel only · Gotham City, 14 Jul</div>'
    );
    return;
  }

  const meta = session.user.user_metadata || {};
  const username = meta.user_name || meta.preferred_username || '';

  if(username.toLowerCase() !== AUTHORIZED_GITHUB_USERNAME.toLowerCase()){
    await authClient.auth.signOut();
    setGate(
      '<div class="bat-eyebrow">Access Denied</div>'
      + '<h2>Not even Robin gets in.</h2>'
      + '<p>This GitHub account (' + (username || 'unknown') + ') isn\'t on Alfred\'s list.</p>'
      + '<button class="gh-login-btn" onclick="doLogin()">Try a different account</button>'
    );
    return;
  }

  document.getElementById('authGate').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  showLoadingOverlay();
  await initDashboard();
  hideLoadingOverlay();
}

authClient.auth.onAuthStateChange(function(event, session){
  if(event === 'SIGNED_IN' || event === 'SIGNED_OUT'){
    checkAuthAndInit();
  }
});

function showLoadingOverlay(){
  const ov=document.getElementById('loadingOverlay');
  ov.classList.add('on');
  const EMOJIS=['🇺🇸','🇲🇽','🇬🇹','🇵🇪','🇧🇴','🇦🇷','🇧🇷','✈️','🌎','🗺️','🏔️','🌴','🌊','🎒','📸','🦜','🦋','⛵','🚂','🏖️'];
  const frag=document.createDocumentFragment();
  for(let i=0;i<28;i++){
    const el=document.createElement('span');
    el.className='fall-emoji';
    el.textContent=EMOJIS[i%EMOJIS.length];
    el.style.cssText='left:'+(Math.random()*100)+'%;font-size:'+(20+Math.random()*18)+'px;animation-duration:'+(3+Math.random()*5)+'s;animation-delay:'+(Math.random()*6)+'s;';
    frag.appendChild(el);
  }
  ov.appendChild(frag);
}
function hideLoadingOverlay(){
  const ov=document.getElementById('loadingOverlay');
  ov.style.transition='opacity .4s ease';
  ov.style.opacity='0';
  setTimeout(function(){ov.classList.remove('on');ov.style.opacity='';ov.style.transition='';ov.querySelectorAll('.fall-emoji').forEach(function(e){e.remove();});},420);
}

checkAuthAndInit();
</script>
</body>
</html>
