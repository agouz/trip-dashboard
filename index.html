<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LSL Flight Log" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#16222C" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2316222C'/%3E%3Ctext x='50' y='66' font-size='55' text-anchor='middle'%3E%E2%9C%88%EF%B8%8F%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22LSL%20Flight%20Log%22%2C%22short_name%22%3A%22Flight%20Log%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2316222C%22%2C%22theme_color%22%3A%22%2316222C%22%2C%22start_url%22%3A%22.%22%7D" />
<title>LSL Flight Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16222C; --ink-2:#1E2E3A; --ink-3:#243747;
    --parchment:#EDE3CF; --parchment-dim:#B9B2A0;
    --amber:#E3A33B; --moss:#6B8E63; --rust:#C1573D; --slate:#4D7A95;
    --hairline:rgba(237,227,207,0.14); --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{background-color:#16222C; background-color:var(--ink);}
  html,body{margin:0; padding:0; background:var(--ink); color:var(--parchment); font-family:'Space Grotesk',sans-serif; min-height:100vh;}
  .mono{font-family:'IBM Plex Mono',monospace; letter-spacing:0.02em;}
  #app{max-width:520px; margin:0 auto; padding:18px 14px 60px; min-height:100vh; background:var(--ink);}

  header.top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--hairline);}
  header.top h1{font-size:19px; font-weight:700; margin:0; letter-spacing:0.01em;}
  header.top .sub{font-size:10.5px; color:var(--parchment-dim); margin-top:2px;}
  header.top .tag{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--amber); border:1px solid var(--amber); padding:3px 7px; border-radius:20px; white-space:nowrap;}

  .banner{background:var(--ink-2); border:1px solid var(--hairline); border-left:3px solid var(--rust); border-radius:var(--radius); padding:13px 14px; margin-bottom:18px; cursor:pointer;}
  .banner .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--rust); margin-bottom:5px;}
  .banner .title{font-size:15px; font-weight:600; margin-bottom:3px; color:var(--parchment);}
  .banner .meta{font-size:11.5px; color:var(--parchment-dim);}

  #countries{display:flex; flex-direction:column; gap:10px;}
  .country{border:1px solid var(--hairline); border-radius:var(--radius); background:var(--ink-2); overflow:hidden;}
  .country-head{display:flex; align-items:center; gap:12px; padding:14px; cursor:pointer;}
  .country-flag{font-size:26px; line-height:1;}
  .country-main{flex:1; min-width:0;}
  .country-name{font-size:15.5px; font-weight:700;}
  .country-dates{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--parchment-dim); margin-top:2px;}
  .country-status{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .status-bar{display:flex; gap:2px;}
  .status-bar i{width:5px; height:14px; border-radius:2px; display:block;}
  .chev{font-size:13px; color:var(--parchment-dim); transition:transform 0.2s ease;}
  .country.open .chev{transform:rotate(90deg);}
  .country-body{display:none; padding:0 12px 14px; border-top:1px solid var(--hairline);}
  .country.open .country-body{display:block;}

  .leg{position:relative; margin-top:10px; cursor:pointer;}
  .leg-card{background:var(--ink-3); border:1px solid var(--hairline); border-radius:10px; padding:11px 13px; position:relative; overflow:hidden;}
  .leg-card::after{content:''; position:absolute; right:0; top:0; bottom:0; width:3px; background:var(--barcolor, var(--parchment-dim));}
  .leg-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .leg-loc{font-size:13.5px; font-weight:600;}
  .leg-dates{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--parchment-dim); margin-top:2px;}
  .pill{font-family:'IBM Plex Mono',monospace; font-size:9px; padding:3px 7px; border-radius:20px; white-space:nowrap; text-transform:uppercase; letter-spacing:0.05em;}
  .pill.booked{background:rgba(107,142,99,0.18); color:var(--moss); border:1px solid rgba(107,142,99,0.4);}
  .pill.partial{background:rgba(77,122,149,0.18); color:var(--slate); border:1px solid rgba(77,122,149,0.4);}
  .pill.open{background:rgba(193,87,61,0.18); color:var(--rust); border:1px solid rgba(193,87,61,0.4);}
  .prio{font-size:9px; font-family:'IBM Plex Mono',monospace; margin-top:5px; opacity:0.75;}

  .booking-badge{font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--amber); margin-top:5px; opacity:0.85;}

  .sheet-tabs{display:flex; gap:6px; margin-bottom:14px;}
  .sheet-tab{flex:1; background:var(--ink-3); border:1px solid var(--hairline); color:var(--parchment-dim); font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:12px; padding:8px 0; border-radius:8px; cursor:pointer; text-align:center;}
  .sheet-tab.active{background:rgba(227,163,59,0.14); border-color:var(--amber); color:var(--amber);}
  .bk-item{background:var(--ink-3); border:1px solid var(--hairline); border-radius:10px; padding:11px 12px; margin-bottom:9px;}
  .bk-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .bk-title{font-size:13px; font-weight:600; display:flex; gap:7px; align-items:flex-start;}
  .bk-cost{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--amber); white-space:nowrap;}
  .bk-provider{font-size:11px; color:var(--parchment-dim); margin-top:3px;}
  .bk-note{font-size:11px; color:var(--parchment-dim); margin-top:5px; line-height:1.4;}
  .bk-status{display:inline-block; margin-top:6px;}
  .pill.paid{background:rgba(107,142,99,0.18); color:var(--moss); border:1px solid rgba(107,142,99,0.4);}
  .pill.confirmed{background:rgba(77,122,149,0.18); color:var(--slate); border:1px solid rgba(77,122,149,0.4);}
  .pill.reserved{background:rgba(227,163,59,0.18); color:var(--amber); border:1px solid rgba(227,163,59,0.4);}
  .bk-empty{font-size:12px; color:var(--parchment-dim); text-align:center; padding:18px 0;}

  #overlay{position:fixed; inset:0; background:rgba(10,15,19,0.6); display:none; align-items:flex-end; z-index:50;}
  #sheet{background:var(--ink-2); width:100%; max-width:520px; margin:0 auto; border-radius:18px 18px 0 0; padding:20px 18px 28px; border-top:1px solid var(--hairline); max-height:82vh; overflow-y:auto; position:relative;}
  #sheet .handle{width:36px; height:4px; background:var(--hairline); border-radius:4px; margin:0 auto 14px;}
  #sheet h2{font-size:18px; margin:0 0 2px;}
  #sheet .dates{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--parchment-dim); margin-bottom:12px;}
  #sheet .row{margin-bottom:12px;}
  #sheet .row .label{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber); margin-bottom:4px;}
  #sheet .row .val{font-size:13px; line-height:1.5; color:var(--parchment);}
  #sheet .close{position:absolute; top:14px; right:16px; background:none; border:none; color:var(--parchment-dim); font-size:18px; cursor:pointer;}

  .empty-note{font-size:11px; color:var(--parchment-dim); text-align:center; margin-top:24px; line-height:1.6;}

  /* COUNTDOWN */
  .countdown{display:flex; gap:8px; margin-bottom:16px;}
  .cd-box{flex:1; background:var(--ink-2); border:1px solid var(--hairline); border-radius:10px; padding:9px 4px; text-align:center;}
  .cd-num{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; color:var(--amber);}
  .cd-label{font-size:8.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--parchment-dim); margin-top:2px;}

  /* MAIN TABS */
  .maintabs{display:flex; gap:5px; margin-bottom:16px;}
  .maintab{flex:1; background:var(--ink-2); border:1px solid var(--hairline); color:var(--parchment-dim); font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:11.5px; padding:9px 0; border-radius:10px; cursor:pointer; text-align:center;}
  .maintab.active{background:rgba(227,163,59,0.14); border-color:var(--amber); color:var(--amber);}

  /* COSTS TAB */
  .cost-hero{background:var(--ink-2); border:1px solid var(--hairline); border-left:3px solid var(--amber); border-radius:var(--radius); padding:16px; margin-bottom:14px; text-align:center;}
  .cost-hero .amt{font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; color:var(--amber);}
  .cost-hero .lbl{font-size:10.5px; color:var(--parchment-dim); text-transform:uppercase; letter-spacing:0.1em; margin-top:4px;}
  .cost-split{display:flex; gap:8px; margin-bottom:18px;}
  .cs-box{flex:1; background:var(--ink-2); border:1px solid var(--hairline); border-radius:10px; padding:10px 6px; text-align:center;}
  .cs-amt{font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600;}
  .cs-lbl{font-size:8.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--parchment-dim); margin-top:3px;}
  .section-title{font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber); margin:18px 0 10px; font-family:'IBM Plex Mono',monospace;}
  .bar-row{margin-bottom:4px; cursor:pointer; padding:8px 8px; border-radius:8px;}
  .bar-row:active{background:rgba(227,163,59,0.10);}
  .bar-top{display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px; color:var(--parchment);}
  .bar-track{height:6px; background:var(--ink-3); border-radius:4px; overflow:hidden;}
  .bar-fill{height:100%; background:var(--amber); border-radius:4px;}
  .country-cost-row{display:flex; align-items:center; justify-content:space-between; padding:11px 8px; border-bottom:1px solid var(--hairline); border-radius:8px; cursor:pointer;}
  .country-cost-row:active{background:rgba(227,163,59,0.10);}
  .country-cost-row:last-child{border-bottom:none;}
  .ccr-left{display:flex; align-items:center; gap:10px;}
  .ccr-flag{font-size:18px;}
  .ccr-name{font-size:13px; font-weight:600; color:var(--parchment);}
  .ccr-amt{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--amber);}
  #costDetailPane{display:none; background:var(--ink-2); border:1px solid var(--amber); border-radius:var(--radius); padding:14px; margin-top:10px;}
  .cdp-title{font-size:13px; font-weight:700; margin-bottom:10px; color:var(--amber);}
  .cdp-item{background:var(--ink-3); border:1px solid var(--hairline); border-radius:8px; padding:9px 10px; margin-bottom:7px; font-size:11.5px;}
  .cdpi-row{display:flex; justify-content:space-between; gap:8px;}
  .cdpi-label{flex:1; color:var(--parchment);}
  .cdpi-cost{font-family:'IBM Plex Mono',monospace; color:var(--amber); white-space:nowrap;}
  .cdpi-sub{color:var(--parchment-dim); margin-top:3px; font-size:11px;}

  /* OTHER / PREP TABS (shared accordion) */
  .misc{border:1px solid var(--hairline); border-radius:var(--radius); background:var(--ink-2); overflow:hidden; margin-bottom:10px;}
  .misc-head{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer;}
  .misc-icon{font-size:19px;}
  .misc-name{font-size:14px; font-weight:700; flex:1; color:var(--parchment);}
  .misc-body{display:none; padding:0 14px 14px; border-top:1px solid var(--hairline);}
  .misc.open .misc-body{display:block;}
  .misc.open .chev{transform:rotate(90deg);}
  .misc-item{padding:10px 0; border-bottom:1px solid var(--hairline); font-size:12.5px; line-height:1.5; color:var(--parchment);}
  .misc-item:last-child{border-bottom:none;}
  .misc-item .mi-label{font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:0.08em; color:var(--amber); margin-bottom:3px;}

  /* CHECKLIST + PACKING */
  .chk-row{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--hairline);}
  .chk-row:last-child{border-bottom:none;}
  .chk-box{width:18px; height:18px; border-radius:5px; border:1.5px solid var(--parchment-dim); flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--ink);}
  .chk-box.checked{background:var(--moss); border-color:var(--moss); color:var(--ink);}
  .chk-text{font-size:13px; line-height:1.4; flex:1; color:var(--parchment);}
  .chk-text.checked{color:var(--parchment-dim); text-decoration:line-through;}
  .chk-del{color:var(--rust); font-size:16px; cursor:pointer; padding:0 4px; flex-shrink:0;}
  .pack-cat-title{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:var(--amber); margin:16px 0 6px;}
  .add-row{display:flex; gap:7px; margin-top:14px;}
  .add-row input, .add-row select{background:var(--ink-3); border:1px solid var(--hairline); color:var(--parchment); border-radius:8px; padding:9px 10px; font-family:'Space Grotesk',sans-serif; font-size:13px;}
  .add-row input{flex:1; min-width:0;}
  .add-row input::placeholder{color:var(--parchment-dim);}
  .add-row button{background:var(--amber); color:var(--ink); border:none; border-radius:8px; padding:9px 14px; font-weight:700; font-size:13px; cursor:pointer; flex-shrink:0;}
  .prep-progress{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--parchment-dim); text-align:right; margin-bottom:8px;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <h1>LSL Flight Log</h1>
      <div class="sub">14 Jul → onward · Sydney out and back</div>
    </div>
    <div class="tag mono" id="dayCount">—</div>
  </header>

  <div id="saveStatusBar" style="display:none; background:var(--ink-2); border:1px solid var(--hairline); border-radius:10px; padding:9px 12px; margin-bottom:14px; font-family:'IBM Plex Mono',monospace; font-size:10.5px; display:flex; justify-content:space-between; align-items:center;">
    <span id="saveStatus">—</span>
    <button id="retrySaveBtn" style="display:none; background:var(--amber); color:var(--ink); border:none; border-radius:6px; padding:4px 9px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:10.5px; cursor:pointer;">Retry</button>
  </div>

  <div class="countdown" id="countdown">
    <div class="cd-box"><div class="cd-num" id="cdDays">--</div><div class="cd-label">days</div></div>
    <div class="cd-box"><div class="cd-num" id="cdHours">--</div><div class="cd-label">hrs</div></div>
    <div class="cd-box"><div class="cd-num" id="cdMins">--</div><div class="cd-label">min</div></div>
    <div class="cd-box"><div class="cd-num" id="cdSecs">--</div><div class="cd-label">sec</div></div>
  </div>

  <div class="maintabs">
    <button class="maintab active" id="mtItinerary" onclick="showMainTab('itinerary')">Trip</button>
    <button class="maintab" id="mtCosts" onclick="showMainTab('costs')">Costs</button>
    <button class="maintab" id="mtPrep" onclick="showMainTab('prep')">Prep</button>
    <button class="maintab" id="mtOther" onclick="showMainTab('other')">Other</button>
  </div>

  <div id="tab-itinerary">
    <div class="banner" id="banner">
      <div class="eyebrow">Next critical action</div>
      <div class="title" id="bannerTitle">Loading…</div>
      <div class="meta" id="bannerMeta"></div>
    </div>

    <div id="countries"></div>
  </div>

  <div id="tab-costs" style="display:none;"></div>

  <div id="tab-prep" style="display:none;"></div>

  <div id="tab-other" style="display:none;"></div>

  <div class="empty-note">Costs reflect everything logged so far, paid or not.</div>
</div>

<div id="overlay">
  <div id="sheet">
    <button class="close" id="closeSheet">✕</button>
    <div class="handle"></div>
    <h2 id="sLoc"></h2>
    <div class="dates mono" id="sDates"></div>

    <div class="sheet-tabs">
      <button class="sheet-tab active" id="tabDetails" onclick="switchTab('details')">Details</button>
      <button class="sheet-tab" id="tabBookings" onclick="switchTab('bookings')">Bookings</button>
    </div>

    <div id="paneDetails">
      <div class="row"><div class="label">Status</div><div class="val" id="sStatus"></div></div>
      <div class="row"><div class="label">Plan</div><div class="val" id="sPlan"></div></div>
      <div class="row" id="sNotesRow"><div class="label">Notes</div><div class="val" id="sNotes"></div></div>
      <div class="row" id="sBookingRow"><div class="label">Booking needed</div><div class="val" id="sBooking"></div></div>
    </div>

    <div id="paneBookings" style="display:none;"></div>
  </div>
</div>

<script>

const PRIO_RANK = {"🚨 High":1,"🟡 Medium":2,"🟢 Low":3,"🟢 watch":3.5,null:4};
let DATA = [];

async function loadData(){
  try{
    const r = await window.storage.get('itinerary_v3', false);
    DATA = JSON.parse(r.value);
  }catch(e){
    DATA = SEED;
    try{ await window.storage.set('itinerary_v3', JSON.stringify(SEED), false); }catch(e2){}
  }
}

function statusPill(s){
  if(s==='booked') return '<span class="pill booked">booked</span>';
  if(s==='partial') return '<span class="pill partial">confirmed · unpaid</span>';
  return '<span class="pill open">not booked</span>';
}
function dotColor(s){ return s==='booked' ? 'var(--moss)' : s==='partial' ? 'var(--slate)' : 'var(--rust)'; }

function computeCritical(){
  const open = DATA.filter(d=>d.status==='open');
  open.sort((a,b)=>{
    const pa = PRIO_RANK[a.priority] ?? 4, pb = PRIO_RANK[b.priority] ?? 4;
    if(pa!==pb) return pa-pb;
    return a.id - b.id;
  });
  return open[0] || null;
}

function renderBanner(){
  const c = computeCritical();
  if(!c){ document.getElementById('bannerTitle').textContent = "Nothing urgent — everything actionable is booked."; document.getElementById('bannerMeta').textContent=''; return; }
  document.getElementById('bannerTitle').textContent = c.loc + " — " + c.dates;
  document.getElementById('bannerMeta').textContent = c.booking;
  document.getElementById('banner').onclick = function(){ openSheet(c.id); };
}

function groupByCountry(){
  const groups = [];
  const order = [];
  DATA.forEach(function(d){ if(order.indexOf(d.country)===-1) order.push(d.country); });
  order.forEach(function(cn){
    const legs = DATA.filter(function(d){ return d.country===cn; });
    groups.push({ country: cn, start: legs[0].start, end: legs[legs.length-1].end, legs: legs });
  });
  return groups;
}

function renderCountries(){
  const groups = groupByCountry();
  const el = document.getElementById('countries');
  el.innerHTML = groups.map(function(g,i){
    const meta = COUNTRY_META[g.country] || {flag:"🏳️",name:g.country};
    const bars = g.legs.map(function(l){ return '<i style="background:'+dotColor(l.status)+'"></i>'; }).join('');
    const legsHtml = g.legs.map(function(l){
      const bkCount = (l.bookings && l.bookings.length) ? l.bookings.length : 0;
      return '<div class="leg" onclick="event.stopPropagation(); openSheet('+l.id+')">'
        + '<div class="leg-card" style="--barcolor:'+dotColor(l.status)+'">'
        + '<div class="leg-top"><div><div class="leg-loc">'+l.loc+'</div>'
        + '<div class="leg-dates">'+l.dates+'</div></div>'+statusPill(l.status)+'</div>'
        + (l.priority ? '<div class="prio mono">priority: '+l.priority+'</div>' : '')
        + (bkCount ? '<div class="booking-badge">🧾 '+bkCount+' booking'+(bkCount>1?'s':'')+'</div>' : '')
        + '</div></div>';
    }).join('');
    return '<div class="country" id="country-'+i+'">'
      + '<div class="country-head" onclick="toggleCountry('+i+')">'
      + '<div class="country-flag">'+meta.flag+'</div>'
      + '<div class="country-main"><div class="country-name">'+meta.name+'</div>'
      + '<div class="country-dates mono">'+g.start+' – '+g.end+'</div></div>'
      + '<div class="country-status"><div class="status-bar">'+bars+'</div><div class="chev">›</div></div>'
      + '</div><div class="country-body">'+legsHtml+'</div></div>';
  }).join('');
}

function toggleCountry(i){
  document.getElementById('country-'+i).classList.toggle('open');
}

function bkStatusPill(s){
  if(s==='paid') return '<span class="pill paid">paid</span>';
  if(s==='confirmed') return '<span class="pill confirmed">confirmed · unpaid</span>';
  return '<span class="pill reserved">reserved</span>';
}

function renderBookings(d){
  const pane = document.getElementById('paneBookings');
  const list = d.bookings || [];
  if(!list.length){
    pane.innerHTML = '<div class="bk-empty">Nothing booked here yet.</div>';
    return;
  }
  pane.innerHTML = list.map(function(b){
    return '<div class="bk-item">'
      + '<div class="bk-top"><div class="bk-title">'+b.cat+' '+b.title+'</div>'
      + '<div class="bk-cost">'+(b.cost||'')+'</div></div>'
      + '<div class="bk-provider">'+(b.provider||'')+'</div>'
      + (b.note ? '<div class="bk-note">'+b.note+'</div>' : '')
      + '<div class="bk-status">'+bkStatusPill(b.status)+'</div>'
      + '</div>';
  }).join('');
  document.getElementById('tabBookings').textContent = 'Bookings (' + list.length + ')';
}

function switchTab(tab){
  const det = document.getElementById('paneDetails'), bk = document.getElementById('paneBookings');
  const tD = document.getElementById('tabDetails'), tB = document.getElementById('tabBookings');
  if(tab==='details'){
    det.style.display='block'; bk.style.display='none';
    tD.classList.add('active'); tB.classList.remove('active');
  }else{
    det.style.display='none'; bk.style.display='block';
    tB.classList.add('active'); tD.classList.remove('active');
  }
}

function openSheet(id){
  const d = DATA.find(function(x){ return x.id===id; });
  if(!d) return;
  document.getElementById('sLoc').textContent = d.loc;
  document.getElementById('sDates').textContent = d.dates + (d.priority ? '  ·  priority: '+d.priority : '');
  document.getElementById('sStatus').innerHTML = statusPill(d.status);
  document.getElementById('sPlan').textContent = d.plan;
  document.getElementById('sBooking').textContent = d.booking || '—';
  document.getElementById('sBookingRow').style.display = d.booking ? 'block':'none';
  document.getElementById('sNotes').textContent = d.notes || '';
  document.getElementById('sNotesRow').style.display = d.notes ? 'block':'none';
  document.getElementById('tabBookings').textContent = 'Bookings' + ((d.bookings && d.bookings.length) ? ' ('+d.bookings.length+')' : '');
  renderBookings(d);
  switchTab('details');
  document.getElementById('overlay').style.display = 'flex';
}
document.getElementById('closeSheet').onclick = function(){ document.getElementById('overlay').style.display='none'; };
document.getElementById('overlay').onclick = function(e){ if(e.target.id==='overlay') e.currentTarget.style.display='none'; };

const GENERAL_COSTS = [
  {cat:"📄",title:"US ESTA",provider:"U.S. Customs and Border Protection",cost:"$62.97",status:"paid",note:"Required before US entry"},
  {cat:"📄",title:"Brazil eVisa",provider:"VFS Global",cost:"$113",status:"paid",note:"Australian passport, tourist eVisa"},
  {cat:"📄",title:"Travel insurance",provider:"Cover-More / CBA Smart Awards",cost:"$0",status:"paid",note:"Activated free via Smart Awards card, whole trip"},
  {cat:"📄",title:"Travel health appointment & vaccinations",provider:"Travel doctor / clinic",cost:"$300",status:"paid",note:"Hep A + yellow fever; malaria/altitude meds advice"},
  {cat:"💊",title:"Malaria medication",provider:"Pharmacy",cost:"$130",status:"paid",note:"For Amazon/Manaus leg — start 1 day before arrival, continue 7 days after"}
];

const ICON_CATEGORY = {"🏨":"Accommodation","✈️":"Flights","🎟️":"Activities & Tours","🚆":"Transport","🚌":"Transport","🚐":"Transport","🚗":"Transport","📄":"Documents & Health","💊":"Documents & Health"};

function parseCost(str){
  if(!str) return 0;
  const n = parseFloat(String(str).replace(/[^0-9.]/g,''));
  return isNaN(n) ? 0 : n;
}

function allBookingsFlat(){
  const out = [];
  DATA.forEach(function(d){
    (d.bookings||[]).forEach(function(b){ out.push(Object.assign({}, b, {country:d.country})); });
  });
  GENERAL_COSTS.forEach(function(b){ out.push(Object.assign({}, b, {country:"General"})); });
  return out;
}

function computeCostSummary(){
  const items = allBookingsFlat();
  const sum = {paid:0, confirmed:0, reserved:0, total:0};
  const byCategory = {};
  const byCountry = {};
  items.forEach(function(b){
    const v = parseCost(b.cost);
    sum.total += v;
    if(b.status==='paid') sum.paid += v;
    else if(b.status==='confirmed') sum.confirmed += v;
    else sum.reserved += v;
    const cat = ICON_CATEGORY[b.cat] || "Other";
    byCategory[cat] = (byCategory[cat]||0) + v;
    byCountry[b.country] = (byCountry[b.country]||0) + v;
  });
  return {sum, byCategory, byCountry};
}

function fmtAud(n){ return '$' + n.toLocaleString('en-AU', {minimumFractionDigits:0, maximumFractionDigits:0}); }

let currentDetailKey = null;
function showCostDetail(type, key){
  const pane = document.getElementById('costDetailPane');
  if(currentDetailKey === type+':'+key){
    pane.style.display = 'none';
    currentDetailKey = null;
    return;
  }
  currentDetailKey = type+':'+key;
  const items = allBookingsFlat().filter(function(b){
    return type==='category' ? (ICON_CATEGORY[b.cat]||'Other')===key : b.country===key;
  });
  const title = type==='category' ? key : ((COUNTRY_META[key] && COUNTRY_META[key].name) || key);
  pane.innerHTML = '<div class="cdp-title">'+title+' · '+fmtAud(items.reduce(function(s,b){return s+parseCost(b.cost);},0))+'</div>'
    + items.map(function(b){
      return '<div class="cdp-item"><div class="cdpi-row"><div class="cdpi-label">'+b.cat+' '+b.title+'</div>'
        + '<div class="cdpi-cost">'+(b.cost||'')+'</div></div>'
        + (b.provider ? '<div class="cdpi-sub">'+b.provider+'</div>' : '')
        + '<div style="margin-top:6px;">'+bkStatusPill(b.status)+'</div></div>';
    }).join('');
  pane.style.display = 'block';
  pane.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderCosts(){
  const el = document.getElementById('tab-costs');
  const {sum, byCategory, byCountry} = computeCostSummary();

  const catEntries = Object.entries(byCategory).sort(function(a,b){ return b[1]-a[1]; });
  const maxCat = Math.max.apply(null, catEntries.map(function(e){ return e[1]; }).concat([1]));
  const catHtml = catEntries.map(function(e){
    const pct = Math.round((e[1]/maxCat)*100);
    return '<div class="bar-row" onclick="showCostDetail(\'category\',\''+e[0].replace(/'/g,"\\'")+'\')">'
      + '<div class="bar-top"><span>'+e[0]+'</span><span class="mono">'+fmtAud(e[1])+'</span></div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div></div>';
  }).join('');

  const countryOrder = ["USA","Mexico","Guatemala","Peru","Bolivia","Argentina","Brazil","China","General"];
  const countryHtml = countryOrder.filter(function(c){ return byCountry[c]; }).map(function(c){
    const meta = COUNTRY_META[c] || {flag:"📋",name:c};
    return '<div class="country-cost-row" onclick="showCostDetail(\'country\',\''+c+'\')"><div class="ccr-left"><div class="ccr-flag">'+meta.flag+'</div><div class="ccr-name">'+meta.name+'</div></div>'
      + '<div class="ccr-amt">'+fmtAud(byCountry[c])+'</div></div>';
  }).join('');

  el.innerHTML =
    '<div class="cost-hero"><div class="amt">'+fmtAud(sum.total)+'</div><div class="lbl">total tracked so far</div></div>'
    + '<div class="cost-split">'
      + '<div class="cs-box"><div class="cs-amt" style="color:var(--moss)">'+fmtAud(sum.paid)+'</div><div class="cs-lbl">paid</div></div>'
      + '<div class="cs-box"><div class="cs-amt" style="color:var(--slate)">'+fmtAud(sum.confirmed)+'</div><div class="cs-lbl">confirmed,<br>unpaid</div></div>'
      + '<div class="cs-box"><div class="cs-amt" style="color:var(--amber)">'+fmtAud(sum.reserved)+'</div><div class="cs-lbl">reserved</div></div>'
    + '</div>'
    + '<div class="section-title">By category — tap for details</div>' + catHtml
    + '<div class="section-title">By country — tap for details</div>' + countryHtml
    + '<div id="costDetailPane"></div>';
}

async function sb(path, options){
  options = options || {};
  const headers = Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  }, options.headers || {});
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, options, {headers: headers}));
  if(!res.ok){
    const txt = await res.text().catch(function(){ return res.statusText; });
    throw new Error('Supabase ' + res.status + ': ' + txt);
  }
  if(res.status === 204) return null;
  return res.json();
}

let PREP_TASKS = [];
let PACKING = [];

async function loadPrep(){
  try{
    PREP_TASKS = await sb('prep_tasks?select=*&order=id.asc');

    showSaveStatus('error loading tasks: ' + e.message);

  try{

}

let lastFailedSave = null;

function showSaveStatus(msg){
  const bar = document.getElementById('saveStatusBar');
  const el = document.getElementById('saveStatus');
  const retryBtn = document.getElementById('retrySaveBtn');
  if(!bar || !el) return;
  const time = new Date().toLocaleTimeString();
  const ok = msg.indexOf('saved')===0 || msg.indexOf('synced')===0;
  el.textContent = (ok ? '✓ ' : '✗ ') + msg + ' · ' + time;
  el.style.color = ok ? 'var(--moss)' : 'var(--rust)';
  bar.style.display = 'flex';
  bar.style.borderColor = ok ? 'var(--moss)' : 'var(--rust)';
  retryBtn.style.display = ok ? 'none' : 'inline-block';
}
async function retrySave(){
  if(lastFailedSave) await lastFailedSave();
}

async function toggleTask(id){
  const t = PREP_TASKS.find(function(x){ return x.id===id; });
  if(!t) return;
  const newVal = !t.checked;
  t.checked = newVal;
  renderPrep();
  try{
    await sb('prep_tasks?id=eq.'+id, {method:'PATCH', body: JSON.stringify({checked:newVal})});
    showSaveStatus('synced'); lastFailedSave = null;
  }catch(e){
    t.checked = !newVal; renderPrep();
    showSaveStatus('error: ' + e.message);
    lastFailedSave = function(){ return toggleTask(id); };
  }
}
async function togglePack(id){
  const p = PACKING.find(function(x){ return x.id===id; });
  if(!p) return;
  const newVal = !p.checked;
  p.checked = newVal;
  renderPrep();
  try{
    await sb('packing_items?id=eq.'+id, {method:'PATCH', body: JSON.stringify({checked:newVal})});
    showSaveStatus('synced'); lastFailedSave = null;
  }catch(e){
    p.checked = !newVal; renderPrep();
    showSaveStatus('error: ' + e.message);
    lastFailedSave = function(){ return togglePack(id); };
  }
}
async function deletePack(id){
  const backup = PACKING.slice();
  PACKING = PACKING.filter(function(x){ return x.id!==id; });
  renderPrep();
  try{
    await sb('packing_items?id=eq.'+id, {method:'DELETE'});
    showSaveStatus('synced'); lastFailedSave = null;
  }catch(e){
    PACKING = backup; renderPrep();
    showSaveStatus('error: ' + e.message);
    lastFailedSave = function(){ return deletePack(id); };
  }
}
async function addPackItem(){
  const input = document.getElementById('newPackText');
  const select = document.getElementById('newPackCat');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  try{
    const inserted = await sb('packing_items', {
      method:'POST',
      headers:{'Prefer':'return=representation'},
      body: JSON.stringify({category: select.value, text: text, checked:false})
    });
    PACKING.push(inserted[0]);
    renderPrep();
    showSaveStatus('synced'); lastFailedSave = null;
  }catch(e){
    showSaveStatus('error: ' + e.message);
    lastFailedSave = addPackItem;
  }
}

function renderPrep(){
  const el = document.getElementById('tab-prep');
  const doneTasks = PREP_TASKS.filter(function(t){ return t.checked; }).length;
  const taskHtml = PREP_TASKS.map(function(t){
    return '<div class="chk-row">'
      + '<div class="chk-box'+(t.checked?' checked':'')+'" onclick="toggleTask('+t.id+')">'+(t.checked?'✓':'')+'</div>'
      + '<div class="chk-text'+(t.checked?' checked':'')+'">'+t.text+'</div>'
    + '</div>';
  }).join('');

  const cats = [];
  PACKING.forEach(function(p){ if(cats.indexOf(p.category)===-1) cats.push(p.category); });
  const donePack = PACKING.filter(function(p){ return p.checked; }).length;
  const packHtml = cats.map(function(cat){
    const items = PACKING.filter(function(p){ return p.category===cat; });
    const rows = items.map(function(p){
      return '<div class="chk-row">'
        + '<div class="chk-box'+(p.checked?' checked':'')+'" onclick="togglePack('+p.id+')">'+(p.checked?'✓':'')+'</div>'
        + '<div class="chk-text'+(p.checked?' checked':'')+'">'+p.text+'</div>'
        + '<div class="chk-del" onclick="deletePack('+p.id+')">×</div>'
      + '</div>';
    }).join('');
    return '<div class="pack-cat-title">'+cat+'</div>' + rows;
  }).join('');

  el.innerHTML =
    '<div class="misc open" id="misc-prep-tasks">'
      + '<div class="misc-head" onclick="toggleMisc2(\'misc-prep-tasks\')"><div class="misc-icon">✅</div><div class="misc-name">Before you go</div><div class="chev">›</div></div>'
      + '<div class="misc-body">'
        + '<div class="prep-progress">'+doneTasks+' / '+PREP_TASKS.length+' done</div>'
        + taskHtml
      + '</div>'
    + '</div>'
    + '<div class="misc open" id="misc-prep-packing">'
      + '<div class="misc-head" onclick="toggleMisc2(\'misc-prep-packing\')"><div class="misc-icon">🧳</div><div class="misc-name">Packing list</div><div class="chev">›</div></div>'
      + '<div class="misc-body">'
        + '<div class="prep-progress">'+donePack+' / '+PACKING.length+' packed</div>'
        + packHtml
        + '<div class="add-row">'
          + '<select id="newPackCat">'
            + ['Documents','Health','Clothing','Tech','Gear','Money','Other'].map(function(c){ return '<option value="'+c+'">'+c+'</option>'; }).join('')
          + '</select>'
          + '<input id="newPackText" type="text" placeholder="Add item…" onkeypress="if(event.key===\'Enter\')addPackItem()">'
          + '<button onclick="addPackItem()">Add</button>'
        + '</div>'
      + '</div>'
    + '</div>';
}

const TRIP_START = new Date("2026-07-14T09:10:00+10:00");
function tickCountdown(){
  const now = new Date();
  let diff = TRIP_START - now;
  if(diff < 0) diff = 0;
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  const secs = Math.floor((diff % 60000) / 1000);
  document.getElementById('cdDays').textContent = days;
  document.getElementById('cdHours').textContent = String(hours).padStart(2,'0');
  document.getElementById('cdMins').textContent = String(mins).padStart(2,'0');
  document.getElementById('cdSecs').textContent = String(secs).padStart(2,'0');
}
